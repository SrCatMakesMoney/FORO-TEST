<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
  />

  <title>Foro Ubre — Videos</title>

  <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="videos.css">
</head>

<body>

  <!-- =========================================================
       BACKGROUND
  ========================================================== -->

  <div class="carbon-bg"></div>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>


  <!-- =========================================================
       TOP BAR
  ========================================================== -->

  <header class="vf-top">

    <button
      class="vf-top-btn"
      onclick="window.location.href='/'"
      aria-label="Volver"
    >
      <i class="ri-arrow-left-line"></i>
    </button>


    <div class="vf-top-title">

      <span class="vf-top-eyebrow">
        <span class="vf-live-dot"></span>
        FORO UBRE
      </span>

      <h2>
        <i class="ri-video-line"></i>
        Videos
      </h2>

    </div>


    <button
      class="vf-top-btn vf-upload-top-btn"
      onclick="abrirUpload()"
      title="Subir video"
      aria-label="Subir video"
    >
      <i class="ri-add-line"></i>
    </button>

  </header>



  <!-- =========================================================
       VIDEO FEED
  ========================================================== -->

  <main
    class="vf-feed"
    id="vfFeed"
  >

    <div class="vf-loading">

      <div class="vf-loading-icon">
        <i class="ri-loader-4-line spin"></i>
      </div>

      <strong>
        Cargando videos...
      </strong>

      <span>
        Preparando tu feed
      </span>

    </div>

  </main>



  <!-- =========================================================
       BACKDROP
  ========================================================== -->

  <div
    class="vf-backdrop hidden"
    id="backdrop"
    onclick="cerrarPaneles()"
  ></div>



  <!-- =========================================================
       COMMENTS PANEL
  ========================================================== -->

  <section
    class="vf-comments-panel"
    id="commentsPanel"
  >

    <div class="vf-comments-handle"></div>


    <div class="vf-comments-header">

      <div class="vf-panel-title">

        <span class="vf-panel-title-icon">
          <i class="ri-chat-3-line"></i>
        </span>

        <strong id="commentsPanelTitle">
          Comentarios
        </strong>

      </div>


      <button
        class="vf-panel-close"
        onclick="cerrarPaneles()"
        aria-label="Cerrar"
      >
        <i class="ri-close-line"></i>
      </button>

    </div>


    <div
      class="vf-comments-list"
      id="commentsList"
    ></div>


    <div class="vf-comment-input-wrap">

      <div
        class="vf-comment-avatar"
        id="commentAvatar"
      ></div>


      <input
        type="text"
        class="vf-comment-input"
        id="commentInput"
        placeholder="Escribe un comentario..."
        maxlength="280"
        onkeydown="if(event.key==='Enter') enviarComentario()"
      >


      <button
        class="vf-comment-submit"
        onclick="enviarComentario()"
        aria-label="Enviar comentario"
      >
        <i class="ri-send-plane-fill"></i>
      </button>

    </div>

  </section>



  <!-- =========================================================
       SHARE SHEET
  ========================================================== -->

  <section
    class="vf-share-sheet"
    id="shareSheet"
  >

    <div class="vf-sheet-handle"></div>


    <div class="vf-share-header">

      <div>
        <span class="vf-sheet-eyebrow">
          ACCIÓN
        </span>

        <h3>
          Compartir video
        </h3>
      </div>

      <span class="vf-share-header-icon">
        <i class="ri-share-forward-line"></i>
      </span>

    </div>


    <div class="vf-share-options">

      <button
        class="vf-share-opt"
        onclick="compartirEnForo()"
      >

        <span class="vf-share-opt-icon">
          <i class="ri-share-forward-fill"></i>
        </span>

        <div>
          <strong>
            Compartir en Foro Ubre
          </strong>

          <small>
            Aparece en tus compartidos del perfil
          </small>
        </div>

        <i class="ri-arrow-right-s-line vf-share-arrow"></i>

      </button>


      <button
        class="vf-share-opt"
        onclick="copiarEnlace()"
      >

        <span class="vf-share-opt-icon">
          <i class="ri-link"></i>
        </span>

        <div>
          <strong>
            Copiar enlace
          </strong>

          <small>
            Copia el enlace del contenido
          </small>
        </div>

        <i class="ri-arrow-right-s-line vf-share-arrow"></i>

      </button>


      <button
        class="vf-share-opt"
        id="btnNativeShare"
        onclick="shareNativo()"
      >

        <span class="vf-share-opt-icon">
          <i class="ri-share-box-line"></i>
        </span>

        <div>
          <strong>
            Más opciones
          </strong>

          <small>
            Compartir usando tu dispositivo
          </small>
        </div>

        <i class="ri-arrow-right-s-line vf-share-arrow"></i>

      </button>

    </div>


    <button
      class="vf-share-cancel"
      onclick="cerrarPaneles()"
    >
      Cancelar
    </button>

  </section>



  <!-- =========================================================
       UPLOAD MODAL
  ========================================================== -->

  <div
    class="vf-modal-overlay hidden"
    id="uploadModal"
  >

    <div class="vf-modal-box">

      <div class="vf-modal-header">

        <div>

          <span class="vf-modal-eyebrow">
            CREAR CONTENIDO
          </span>

          <h3>
            <span class="vf-modal-title-icon">
              <i class="ri-video-add-line"></i>
            </span>

            Subir video
          </h3>

        </div>


        <button
          class="vf-modal-close"
          onclick="cerrarUpload()"
          aria-label="Cerrar"
        >
          <i class="ri-close-line"></i>
        </button>

      </div>



      <!-- Upload area -->

      <div
        class="vf-upload-area"
        id="uploadArea"
        onclick="document.getElementById('videoInput').click()"
      >

        <div class="vf-upload-icon">
          <i class="ri-video-add-line"></i>
        </div>

        <strong>
          Selecciona un video
        </strong>

        <p>
          Toca aquí para elegir un archivo desde tu dispositivo.
        </p>

        <small>
          MP4 o WebM · Máx. 100MB
        </small>

      </div>


      <input
        type="file"
        id="videoInput"
        accept="video/mp4,video/webm,video/quicktime"
        hidden
      >



      <!-- Preview -->

      <div class="vf-preview-wrap">

        <video
          id="videoPreviewEl"
          class="vf-video-preview hidden"
          controls
          playsinline
        ></video>

      </div>



      <!-- Description -->

      <div class="vf-form-group">

        <div class="vf-form-label">

          <label for="videoDesc">
            <i class="ri-text"></i>
            DESCRIPCIÓN
          </label>

          <span>
            <span id="descCount">300</span>
          </span>

        </div>


        <textarea
          id="videoDesc"
          rows="3"
          maxlength="300"
          placeholder="Describe tu video... #hashtags @menciones"
        ></textarea>

      </div>



      <!-- Progress -->

      <div
        id="uploadProgress"
        class="vf-upload-progress hidden"
      >

        <div class="vf-progress-track">

          <div
            id="progressBar"
            class="vf-progress-fill"
          ></div>

        </div>


        <div class="vf-progress-info">

          <span>
            Subiendo video
          </span>

          <strong id="progressText">
            Subiendo... 0%
          </strong>

        </div>

      </div>



      <!-- Submit -->

      <button
        class="vf-btn-auth"
        id="btnSubirVideo"
        onclick="subirVideo()"
        disabled
      >

        <i class="ri-upload-cloud-line"></i>

        <span>
          Publicar video
        </span>

      </button>

    </div>

  </div>



  <!-- =========================================================
       TOAST
  ========================================================== -->

  <div
    class="vf-toast"
    id="toast"
  ></div>



  <!-- =========================================================
       ORIGINAL JAVASCRIPT
       NO SE CAMBIA LA LÓGICA
  ========================================================== -->

  <script>

    const API   = "/api";
    const token = localStorage.getItem("fu_token");
    const yo    = JSON.parse(localStorage.getItem("fu_usuario") || "null");

    if (!token || !yo) {
      window.location.href = "/login.html";
    }


    // ══════════════════════════
    // ESTADO
    // ══════════════════════════

    let videos       = [];
    let pagina       = 1;
    let cargando     = false;
    let hayMas       = true;
    let videoActivo  = null;
    let videoFile    = null;
    let lastTap      = 0;
    let viewedIds    = new Set();



    // ══════════════════════════
    // CARGAR VIDEOS
    // ══════════════════════════

    async function cargarVideos(reset = true) {

      if (cargando) return;

      cargando = true;


      if (reset) {

        pagina = 1;
        hayMas = true;
        videos = [];


        document.getElementById("vfFeed").innerHTML = `

          <div class="vf-loading">

            <div class="vf-loading-icon">
              <i class="ri-loader-4-line spin"></i>
            </div>

            <strong>
              Cargando videos...
            </strong>

            <span>
              Preparando tu feed
            </span>

          </div>

        `;

      }


      try {

        const res = await fetch(
          `${API}/videos?pagina=${pagina}&limite=10`,
          {
            headers: {
              Authorization: `Bearer ${token}`
            }
          }
        );


        const data = await res.json();


        if (!res.ok) {
          throw new Error(data.mensaje);
        }


        if (reset) {
          document.getElementById("vfFeed").innerHTML = "";
        }


        if (!data.length && reset) {

          document.getElementById("vfFeed").innerHTML = `

            <div class="vf-empty">

              <div class="vf-empty-icon">
                <i class="ri-video-line"></i>
              </div>

              <h2>
                Todavía no hay videos
              </h2>

              <p>
                Sé el primero en subir algo a Foro Ubre.
              </p>

              <button
                class="vf-empty-button"
                onclick="abrirUpload()"
              >
                <i class="ri-add-line"></i>
                Subir video
              </button>

            </div>

          `;

          return;
        }


        videos.push(...data);


        data.forEach(v => {
          renderVideo(v);
        });


        if (data.length < 10) {
          hayMas = false;
        }


        setupObserver();

      }


      catch (err) {

        document.getElementById("vfFeed").innerHTML = `

          <div class="vf-empty">

            <div class="vf-empty-icon vf-error-icon">
              <i class="ri-error-warning-line"></i>
            </div>

            <h2>
              No se pudieron cargar los videos
            </h2>

            <p>
              Comprueba tu conexión e inténtalo nuevamente.
            </p>

            <button
              class="vf-empty-button"
              onclick="cargarVideos()"
            >
              <i class="ri-refresh-line"></i>
              Reintentar
            </button>

          </div>

        `;

      }


      finally {
        cargando = false;
      }

    }



    // ══════════════════════════
    // RENDER VIDEO
    // ══════════════════════════

    function renderVideo(v) {

      const feed = document.getElementById("vfFeed");

      const esMio = v.autor._id === yo._id;


      const avEl = v.autor.avatarTipo === "video"

        ? `
          <video
            src="${v.autor.avatar}"
            autoplay
            loop
            muted
            playsinline
          ></video>
        `

        : `
          <img
            src="${v.autor.avatar}"
            alt=""
          />
        `;


      const item = document.createElement("div");

      item.className = "vf-item";

      item.dataset.id = v._id;


      item.innerHTML = `

        <!-- VIDEO -->

        <video
          class="vf-video"
          src="${v.url}"
          loop
          playsinline
          preload="metadata"
          data-id="${v._id}"
        ></video>



        <!-- TAP -->

        <div
          class="vf-tap-area"
          id="tap-${v._id}"
        ></div>



        <!-- PLAY -->

        <div
          class="vf-play-icon"
          id="playIcon-${v._id}"
        >
          <i class="ri-pause-fill"></i>
        </div>



        <!-- HEART -->

        <div
          class="vf-heart-anim"
          id="heartAnim-${v._id}"
        >
          <i class="ri-heart-fill"></i>
        </div>



        <!-- TOP GRADIENT -->

        <div class="vf-overlay-top"></div>



        <!-- VIDEO TOP META -->

        <div class="vf-video-badge">

          <span>
            <i class="ri-play-circle-line"></i>
            FORO UBRE
          </span>

        </div>



        <!-- BOTTOM INFO -->

        <div class="vf-overlay-bottom">

          <div
            class="vf-user-row"
            onclick="window.location.href='profile.html?handle=${escHtml(v.autor.handle)}'"
          >

            <div class="vf-avatar-btn">
              ${avEl}
            </div>

            <div class="vf-user-copy">

              <div class="vf-autor-nombre">
                ${escHtml(v.autor.nombre)}
              </div>

              <div class="vf-autor-handle">
                @${escHtml(v.autor.handle)}
              </div>

            </div>

          </div>


          ${
            v.descripcion
              ? `
                <p class="vf-desc">
                  ${escHtml(v.descripcion)}
                </p>
              `
              : ""
          }


          <div class="vf-vistas">

            <i class="ri-eye-line"></i>

            <span>
              ${formatNum(v.reproducciones)}
            </span>

            reproducciones

          </div>

        </div>



        <!-- ACTIONS -->

        <div class="vf-actions">


          <!-- PROFILE -->

          <button
            class="vf-action-profile"
            onclick="window.location.href='profile.html?handle=${escHtml(v.autor.handle)}'"
            aria-label="Ver perfil"
          >

            ${avEl}

          </button>



          <!-- LIKE -->

          <button
            class="vf-btn ${v.yaLike ? 'liked' : ''}"
            id="likeBtn-${v._id}"
            onclick="toggleLike('${v._id}')"
            aria-label="Me gusta"
          >

            <span class="vf-action-icon">

              <i class="${v.yaLike ? 'ri-heart-fill' : 'ri-heart-line'}"></i>

            </span>

            <span id="likeCount-${v._id}">
              ${formatNum(v.totalLikes)}
            </span>

          </button>



          <!-- COMMENTS -->

          <button
            class="vf-btn"
            onclick="abrirComentarios('${v._id}')"
            aria-label="Comentarios"
          >

            <span class="vf-action-icon">
              <i class="ri-chat-1-line"></i>
            </span>

            <span id="commentCount-${v._id}">
              ${formatNum(v.totalComments)}
            </span>

          </button>



          <!-- SHARE -->

          <button
            class="vf-btn ${v.yaCompartio ? 'shared' : ''}"
            id="shareBtn-${v._id}"
            onclick="abrirShare('${v._id}')"
            aria-label="Compartir"
          >

            <span class="vf-action-icon">

              <i class="${v.yaCompartio ? 'ri-share-forward-fill' : 'ri-share-forward-line'}"></i>

            </span>

            <span id="shareCount-${v._id}">
              ${formatNum(v.totalCompartidos)}
            </span>

          </button>



          ${
            esMio

              ? `

                <button
                  class="vf-btn vf-delete-btn"
                  onclick="eliminarVideo('${v._id}')"
                  aria-label="Borrar video"
                >

                  <span class="vf-action-icon">
                    <i class="ri-delete-bin-6-line"></i>
                  </span>

                  <span>
                    Borrar
                  </span>

                </button>

              `

              : ""
          }

        </div>



        <!-- PROGRESS -->

        <div class="vf-progress">

          <div
            class="vf-progress-bar"
            id="prog-${v._id}"
          ></div>

        </div>

      `;


      feed.appendChild(item);

      setupTap(item, v._id);

    }



    // ══════════════════════════
    // TAP
    // ══════════════════════════

    function setupTap(item, videoId) {

      const tapArea =
        item.querySelector(".vf-tap-area");


      tapArea.addEventListener("click", (e) => {

        const now = Date.now();

        const gap = now - lastTap;

        lastTap = now;


        if (gap < 300) {

          likeConAnimacion(
            videoId,
            item
          );

        }


        else {

          setTimeout(() => {

            if (Date.now() - lastTap < 300) {
              return;
            }


            const video =
              item.querySelector(".vf-video");


            const icon =
              document.getElementById(
                `playIcon-${videoId}`
              );


            if (video.paused) {

              video.play();

              icon.innerHTML =
                '<i class="ri-pause-fill"></i>';

            }


            else {

              video.pause();

              icon.innerHTML =
                '<i class="ri-play-fill"></i>';

              icon.classList.add("show");


              setTimeout(() => {
                icon.classList.remove("show");
              }, 800);

            }

          }, 300);

        }

      });

    }



    function likeConAnimacion(videoId, item) {

      const heart =
        document.getElementById(
          `heartAnim-${videoId}`
        );


      heart.classList.add("pop");


      setTimeout(() => {
        heart.classList.add("fade");
      }, 300);


      setTimeout(() => {

        heart.classList.remove(
          "pop",
          "fade"
        );

      }, 700);


      const btn =
        document.getElementById(
          `likeBtn-${videoId}`
        );


      if (!btn?.classList.contains("liked")) {
        toggleLike(videoId);
      }

    }



    // ══════════════════════════
    // INTERSECTION OBSERVER
    // ══════════════════════════

    function setupObserver() {

      const observer =
        new IntersectionObserver(
          (entries) => {

            entries.forEach(entry => {

              const video =
                entry.target.querySelector(
                  ".vf-video"
                );


              const id =
                entry.target.dataset.id;


              if (!video) return;


              if (entry.isIntersecting) {

                video.play().catch(() => {});


                if (!viewedIds.has(id)) {

                  viewedIds.add(id);


                  fetch(
                    `${API}/videos/${id}/view`,
                    {
                      method: "POST",
                      headers: {
                        Authorization:
                          `Bearer ${token}`
                      }
                    }
                  );

                }


                video.addEventListener(
                  "timeupdate",
                  () => {

                    const pct =
                      (video.currentTime /
                      video.duration) * 100 || 0;


                    const bar =
                      document.getElementById(
                        `prog-${id}`
                      );


                    if (bar) {
                      bar.style.width =
                        pct + "%";
                    }

                  }
                );


                const items =
                  document.querySelectorAll(
                    ".vf-item"
                  );


                if (
                  entry.target ===
                  items[items.length - 1] &&
                  !cargando &&
                  hayMas
                ) {

                  pagina++;

                  cargarVideos(false);

                }

              }


              else {

                video.pause();

              }

            });

          },

          {
            threshold: 0.75
          }

        );


      document
        .querySelectorAll(".vf-item")
        .forEach(el => observer.observe(el));

    }



    // ══════════════════════════
    // LIKE
    // ══════════════════════════

    async function toggleLike(videoId) {

      const btn =
        document.getElementById(
          `likeBtn-${videoId}`
        );


      const count =
        document.getElementById(
          `likeCount-${videoId}`
        );


      const liked =
        btn?.classList.contains("liked");


      if (btn) {

        btn.classList.toggle(
          "liked"
        );


        btn.querySelector("i").className =
          liked
            ? "ri-heart-line"
            : "ri-heart-fill";

      }


      try {

        const res =
          await fetch(
            `${API}/videos/${videoId}/like`,
            {
              method: "POST",
              headers: {
                Authorization:
                  `Bearer ${token}`
              }
            }
          );


        const data =
          await res.json();


        if (count) {
          count.textContent =
            formatNum(data.totalLikes);
        }


        if (btn) {

          btn.classList.toggle(
            "liked",
            data.yaLike
          );


          btn.querySelector("i").className =
            data.yaLike
              ? "ri-heart-fill"
              : "ri-heart-line";

        }

      }


      catch (_) {

        if (btn) {
          btn.classList.toggle("liked");
        }

      }

    }



    // ══════════════════════════
    // COMENTARIOS
    // ══════════════════════════

    async function abrirComentarios(videoId) {

      videoActivo = videoId;


      document.getElementById(
        "commentsList"
      ).innerHTML = `

        <div class="vf-comments-loading">

          <i class="ri-loader-4-line spin"></i>

          <span>
            Cargando comentarios...
          </span>

        </div>

      `;


      const avHTML =
        yo.avatarTipo === "video"

          ? `
            <video
              src="${yo.avatar}"
              autoplay
              loop
              muted
              playsinline
            ></video>
          `

          : `
            <img
              src="${yo.avatar}"
              alt=""
            />
          `;


      document.getElementById(
        "commentAvatar"
      ).innerHTML = avHTML;


      document
        .getElementById("backdrop")
        .classList.remove("hidden");


      document
        .getElementById("commentsPanel")
        .classList.add("open");


      document
        .getElementById("commentInput")
        .focus();


      try {

        const res =
          await fetch(
            `${API}/videos/${videoId}/comments`,
            {
              headers: {
                Authorization:
                  `Bearer ${token}`
              }
            }
          );


        const data =
          await res.json();


        const list =
          document.getElementById(
            "commentsList"
          );


        document.getElementById(
          "commentsPanelTitle"
        ).textContent =
          `Comentarios · ${data.length}`;


        if (!data.length) {

          list.innerHTML = `

            <div class="vf-comment-empty">

              <div class="vf-comment-empty-icon">
                <i class="ri-chat-3-line"></i>
              </div>

              <strong>
                Sin comentarios todavía
              </strong>

              <span>
                Sé el primero en comentar.
              </span>

            </div>

          `;

        }


        else {

          list.innerHTML =
            data
              .map(c =>
                renderComentarioHTML(c)
              )
              .join("");


          list.scrollTop =
            list.scrollHeight;

        }

      }

      catch (_) {}

    }



    function renderComentarioHTML(c) {

      const avEl =
        c.autor.avatarTipo === "video"

          ? `
            <video
              src="${c.autor.avatar}"
              autoplay
              loop
              muted
              playsinline
            ></video>
          `

          : `
            <img
              src="${c.autor.avatar}"
              alt=""
            />
          `;


      return `

        <div
          class="vf-comment-item"
          id="vc-${c._id}"
        >

          <div class="vf-comment-avatar-small">
            ${avEl}
          </div>


          <div class="vf-comment-body">

            <div class="vf-comment-author">

              <strong>
                ${escHtml(c.autor.nombre)}
              </strong>

              <small>
                · ${tiempoRelativo(c.createdAt)}
              </small>

            </div>


            <p class="vf-comment-texto">
              ${escHtml(c.texto)}
            </p>


            <button
              class="vf-comment-like ${c.yaLike ? 'liked' : ''}"
              onclick="likeComentario('${c._id}', this)"
            >

              <i class="${c.yaLike ? 'ri-heart-fill' : 'ri-heart-line'}"></i>

              <span>
                ${c.totalLikes}
              </span>

            </button>

          </div>

        </div>

      `;

    }



    async function enviarComentario() {

      const inp =
        document.getElementById(
          "commentInput"
        );


      const texto =
        inp?.value.trim();


      if (!texto || !videoActivo) {
        return;
      }


      inp.value = "";

      inp.disabled = true;


      try {

        const res =
          await fetch(
            `${API}/videos/${videoActivo}/comments`,
            {
              method: "POST",

              headers: {
                Authorization:
                  `Bearer ${token}`,

                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  texto
                })
            }
          );


        const data =
          await res.json();


        if (!res.ok) {
          throw new Error(
            data.mensaje
          );
        }


        const list =
          document.getElementById(
            "commentsList"
          );


        const empty =
          list.querySelector(
            ".vf-comment-empty"
          );


        if (empty) {
          list.innerHTML = "";
        }


        list.insertAdjacentHTML(
          "beforeend",
          renderComentarioHTML(data)
        );


        list.scrollTop =
          list.scrollHeight;


        const cnt =
          document.getElementById(
            `commentCount-${videoActivo}`
          );


        if (cnt) {

          cnt.textContent =
            formatNum(
              parseInt(
                cnt.textContent
                  .replace(/[^0-9]/g, "")
              ) + 1
            );

        }


        const title =
          document.getElementById(
            "commentsPanelTitle"
          );


        if (title) {

          const n =
            list.querySelectorAll(
              ".vf-comment-item"
            ).length;


          title.textContent =
            `Comentarios · ${n}`;

        }

      }


      catch (e) {

        toast(
          "Error: " + e.message
        );

      }


      finally {

        if (inp) {

          inp.disabled = false;

          inp.focus();

        }

      }

    }



    async function likeComentario(
      id,
      btn
    ) {

      try {

        const res =
          await fetch(
            `${API}/videos/comments/${id}/like`,
            {
              method: "POST",

              headers: {
                Authorization:
                  `Bearer ${token}`
              }
            }
          );


        const data =
          await res.json();


        btn.classList.toggle(
          "liked",
          data.yaLike
        );


        btn.innerHTML = `

          <i class="${
            data.yaLike
              ? "ri-heart-fill"
              : "ri-heart-line"
          }"></i>

          <span>
            ${data.totalLikes}
          </span>

        `;

      }

      catch (_) {}

    }



    // ══════════════════════════
    // COMPARTIR
    // ══════════════════════════

    function abrirShare(videoId) {

      videoActivo = videoId;


      document
        .getElementById("backdrop")
        .classList.remove("hidden");


      document
        .getElementById("shareSheet")
        .classList.add("open");

    }



    async function compartirEnForo() {

      if (!videoActivo) {
        return;
      }


      try {

        const res =
          await fetch(
            `${API}/videos/${videoActivo}/share`,
            {
              method: "POST",

              headers: {
                Authorization:
                  `Bearer ${token}`
              }
            }
          );


        const data =
          await res.json();


        const btn =
          document.getElementById(
            `shareBtn-${videoActivo}`
          );


        const count =
          document.getElementById(
            `shareCount-${videoActivo}`
          );


        if (btn) {

          btn.classList.add(
            "shared"
          );


          btn.querySelector(
            "i"
          ).className =
            "ri-share-forward-fill";

        }


        if (count) {

          count.textContent =
            formatNum(
              data.totalCompartidos
            );

        }


        cerrarPaneles();

        toast(
          "Compartido en tu perfil"
        );

      }


      catch (_) {

        toast(
          "Error al compartir"
        );

      }

    }



    function copiarEnlace() {

      const url =
        `${location.origin}/videos.html`;


      navigator.clipboard
        .writeText(url)
        .then(() => {

          cerrarPaneles();

          toast(
            "Enlace copiado"
          );

        });

    }



    async function shareNativo() {

      if (!navigator.share) {

        copiarEnlace();

        return;

      }


      try {

        await navigator.share({

          title:
            "Foro Ubre — Video",

          url:
            `${location.origin}/videos.html`

        });


        cerrarPaneles();

      }

      catch (_) {}

    }



    // ══════════════════════════
    // ELIMINAR
    // ══════════════════════════

    async function eliminarVideo(videoId) {

      if (!confirm("¿Eliminar este video?")) {
        return;
      }


      try {

        const res =
          await fetch(
            `${API}/videos/${videoId}`,
            {
              method: "DELETE",

              headers: {
                Authorization:
                  `Bearer ${token}`
              }
            }
          );


        if (!res.ok) {
          throw new Error();
        }


        const item =
          document.querySelector(
            `.vf-item[data-id="${videoId}"]`
          );


        if (item) {

          item.classList.add(
            "removing"
          );


          setTimeout(() => {
            item.remove();
          }, 350);

        }


        toast(
          "Video eliminado"
        );

      }


      catch (_) {

        toast(
          "Error al eliminar"
        );

      }

    }



    // ══════════════════════════
    // UPLOAD
    // ══════════════════════════

    function abrirUpload() {

      document
        .getElementById("uploadModal")
        .classList.remove("hidden");

    }



    function cerrarUpload() {

      document
        .getElementById("uploadModal")
        .classList.add("hidden");


      document.getElementById(
        "videoInput"
      ).value = "";


      document.getElementById(
        "videoPreviewEl"
      ).classList.add("hidden");


      document.getElementById(
        "videoPreviewEl"
      ).src = "";


      document.getElementById(
        "uploadArea"
      ).classList.remove("hidden");


      document.getElementById(
        "videoDesc"
      ).value = "";


      document.getElementById(
        "descCount"
      ).textContent = "300";


      document.getElementById(
        "btnSubirVideo"
      ).disabled = true;


      document.getElementById(
        "uploadProgress"
      ).classList.add("hidden");


      videoFile = null;

    }



    document
      .getElementById("videoInput")
      .addEventListener(
        "change",
        function() {

          const file =
            this.files[0];


          if (!file) {
            return;
          }


          if (
            file.size >
            100 * 1024 * 1024
          ) {

            toast(
              "Máximo 100MB"
            );

            this.value = "";

            return;

          }


          videoFile = file;


          const url =
            URL.createObjectURL(
              file
            );


          document
            .getElementById(
              "uploadArea"
            )
            .classList.add(
              "hidden"
            );


          const prev =
            document.getElementById(
              "videoPreviewEl"
            );


          prev.src = url;


          prev.classList.remove(
            "hidden"
          );


          document.getElementById(
            "btnSubirVideo"
          ).disabled = false;

        }
      );



    document
      .getElementById("videoDesc")
      .addEventListener(
        "input",
        function() {

          document.getElementById(
            "descCount"
          ).textContent =
            300 - this.value.length;

        }
      );



    async function subirVideo() {

      if (!videoFile) {
        return;
      }


      const btn =
        document.getElementById(
          "btnSubirVideo"
        );


      const prog =
        document.getElementById(
          "uploadProgress"
        );


      const bar =
        document.getElementById(
          "progressBar"
        );


      const text =
        document.getElementById(
          "progressText"
        );


      btn.innerHTML = `

        <i class="ri-loader-4-line spin"></i>

        <span>
          Subiendo...
        </span>

      `;


      btn.disabled = true;


      prog.classList.remove(
        "hidden"
      );


      try {

        await new Promise(
          (resolve, reject) => {

            const formData =
              new FormData();


            formData.append(
              "video",
              videoFile
            );


            formData.append(
              "descripcion",
              document
                .getElementById(
                  "videoDesc"
                )
                .value
                .trim()
            );


            const xhr =
              new XMLHttpRequest();


            xhr.open(
              "POST",
              `${API}/videos`
            );


            xhr.setRequestHeader(
              "Authorization",
              `Bearer ${token}`
            );


            xhr.upload.addEventListener(
              "progress",
              e => {

                if (e.lengthComputable) {

                  const pct =
                    Math.round(
                      (e.loaded /
                       e.total) * 100
                    );


                  bar.style.width =
                    pct + "%";


                  text.textContent =
                    `Subiendo... ${pct}%`;

                }

              }
            );


            xhr.addEventListener(
              "load",
              () => {

                if (
                  xhr.status >= 200 &&
                  xhr.status < 300
                ) {

                  const data =
                    JSON.parse(
                      xhr.responseText
                    );


                  cerrarUpload();


                  toast(
                    "Video publicado"
                  );


                  document.getElementById(
                    "vfFeed"
                  ).innerHTML = "";


                  videos.unshift(
                    data
                  );


                  renderVideo(
                    data
                  );


                  videos.forEach(v => {

                    if (
                      v._id !==
                      data._id
                    ) {

                      renderVideo(v);

                    }

                  });


                  setupObserver();


                  resolve();

                }


                else {

                  const data =
                    JSON.parse(
                      xhr.responseText
                    );


                  reject(
                    new Error(
                      data.mensaje ||
                      "Error al subir"
                    )
                  );

                }

              }
            );


            xhr.addEventListener(
              "error",
              () => {

                reject(
                  new Error(
                    "Error de red"
                  )
                );

              }
            );


            xhr.send(
              formData
            );

          }
        );

      }


      catch (err) {

        toast(
          err.message
        );


        btn.innerHTML = `

          <i class="ri-upload-cloud-line"></i>

          <span>
            Publicar video
          </span>

        `;


        btn.disabled = false;

        bar.style.width = "0%";

      }

    }



    // ══════════════════════════
    // CERRAR PANELES
    // ══════════════════════════

    function cerrarPaneles() {

      document
        .getElementById("backdrop")
        .classList.add("hidden");


      document
        .getElementById("commentsPanel")
        .classList.remove("open");


      document
        .getElementById("shareSheet")
        .classList.remove("open");

    }



    // ══════════════════════════
    // TOAST
    // ══════════════════════════

    let toastTimer;


    function toast(msg) {

      const el =
        document.getElementById(
          "toast"
        );


      el.textContent = msg;


      el.classList.add(
        "show"
      );


      clearTimeout(
        toastTimer
      );


      toastTimer =
        setTimeout(() => {

          el.classList.remove(
            "show"
          );

        }, 2500);

    }



    // ══════════════════════════
    // UTILS
    // ══════════════════════════

    function escHtml(s = "") {

      return String(s)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        );

    }



    function tiempoRelativo(f) {

      const d =
        (Date.now() -
        new Date(f)) / 1000;


      if (d < 60) {
        return "ahora";
      }


      if (d < 3600) {
        return `${Math.floor(d / 60)}m`;
      }


      if (d < 86400) {
        return `${Math.floor(d / 3600)}h`;
      }


      return `${Math.floor(d / 86400)}d`;

    }



    function formatNum(n = 0) {

      if (n >= 1000000) {

        return (
          (n / 1000000)
            .toFixed(1) +
          "M"
        );

      }


      if (n >= 1000) {

        return (
          (n / 1000)
            .toFixed(1) +
          "K"
        );

      }


      return String(n);

    }



    // ══════════════════════════
    // INIT
    // ══════════════════════════

    cargarVideos();

  </script>

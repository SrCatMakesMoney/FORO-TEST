<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta name="theme-color" content="#050606"/>

    <title>Foro Ubre — Iniciar sesión</title>

    <link
        href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css"
        rel="stylesheet"
    />

    <link rel="stylesheet" href="auth.css"/>
</head>

<body class="auth-page">

    <main class="auth-container">

        <div class="auth-logo">
            <i class="ri-leaf-fill"></i>
            <span>Foro Ubre</span>
        </div>

        <h2>Bienvenido de vuelta</h2>

        <form id="loginForm" novalidate>

            <div class="form-group">

                <label>
                    <i class="ri-mail-line"></i>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="tu@email.com"
                    required
                    autocomplete="email"
                />

            </div>

            <div class="form-group">

                <label>
                    <i class="ri-lock-line"></i>
                    Contraseña
                </label>

                <div class="input-password-wrap">

                    <input
                        type="password"
                        id="password"
                        placeholder="••••••••"
                        required
                        autocomplete="current-password"
                    />

                    <button
                        type="button"
                        class="btn-toggle-pass"
                        id="btnTogglePass"
                        tabindex="-1"
                        aria-label="Mostrar contraseña"
                    >
                        <i
                            class="ri-eye-line"
                            id="eyeIcon"
                        ></i>
                    </button>

                </div>

            </div>

            <div
                id="errorMsg"
                class="error-msg hidden"
                role="alert"
            >
                <i class="ri-error-warning-line"></i>
                <span id="errorText"></span>
            </div>

            <button
                type="submit"
                class="btn-auth"
                id="btnLogin"
            >
                <i class="ri-login-box-line"></i>
                <span>Iniciar sesión</span>
            </button>

        </form>

        <p class="auth-switch">
            ¿No tienes cuenta?
            <a href="register.html">Regístrate aquí</a>
        </p>

    </main>

    <script>
        /* =====================================================
           AUTH REDIRECT
           ===================================================== */

        if (localStorage.getItem("fu_token")) {
            window.location.href = "/";
        }


        /* =====================================================
           TOGGLE PASSWORD
           ===================================================== */

        document
            .getElementById("btnTogglePass")
            .addEventListener("click", () => {

                const input =
                    document.getElementById("password");

                const icon =
                    document.getElementById("eyeIcon");

                if (input.type === "password") {

                    input.type = "text";

                    icon.className =
                        "ri-eye-off-line";

                } else {

                    input.type = "password";

                    icon.className =
                        "ri-eye-line";
                }
            });


        /* =====================================================
           LOGIN
           ===================================================== */

        document
            .getElementById("loginForm")
            .addEventListener("submit", async (e) => {

                e.preventDefault();

                const btn =
                    document.getElementById("btnLogin");

                const errorBox =
                    document.getElementById("errorMsg");

                const errorText =
                    document.getElementById("errorText");

                errorBox.classList.add("hidden");

                btn.innerHTML =
                    '<i class="ri-loader-4-line spin"></i><span>Entrando...</span>';

                btn.disabled = true;

                try {

                    const res = await fetch(
                        "/api/auth/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                email:
                                    document
                                        .getElementById("email")
                                        .value
                                        .trim(),

                                password:
                                    document
                                        .getElementById("password")
                                        .value
                            })
                        }
                    );

                    const data = await res.json();

                    if (!res.ok) {
                        throw new Error(
                            data.mensaje ||
                            "No se pudo iniciar sesión."
                        );
                    }

                    localStorage.setItem(
                        "fu_token",
                        data.token
                    );

                    localStorage.setItem(
                        "fu_usuario",
                        JSON.stringify(data.usuario)
                    );

                    window.location.href = "/";

                } catch (err) {

                    errorText.textContent =
                        err.message ||
                        "Ocurrió un error.";

                    errorBox.classList.remove("hidden");

                    btn.innerHTML =
                        '<i class="ri-login-box-line"></i><span>Iniciar sesión</span>';

                    btn.disabled = false;
                }
            });
    </script>

</body>
</html>

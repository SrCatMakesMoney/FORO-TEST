<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Iniciar sesión — Foro Ubre</title>

  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
</head>

<body class="auth-page">

  <div class="auth-atmosphere" aria-hidden="true">
    <div class="auth-smoke auth-smoke-a"></div>
    <div class="auth-smoke auth-smoke-b"></div>
    <div class="auth-smoke auth-smoke-c"></div>
    <div class="auth-grain"></div>
    <div class="auth-orb"></div>
  </div>

  <main class="auth-stage">

    <div class="auth-container">

      <div class="auth-brand">
        <div class="auth-logo">
          <span class="auth-logo-mark">
            <i class="ri-leaf-fill"></i>
          </span>

          <span>Foro Ubre</span>
        </div>

        <span class="auth-live">
          <span></span>
          comunidad
        </span>
      </div>

      <div class="auth-heading">
        <h2>Bienvenido de vuelta</h2>
        <p>Tu espacio está listo.</p>
      </div>

      <form id="loginForm">

        <div class="form-group">
          <label for="email">
            <i class="ri-mail-line"></i>
            Correo electrónico
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="tu@email.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">
            <i class="ri-lock-2-line"></i>
            Contraseña
          </label>

          <div class="input-password-wrap">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Tu contraseña"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="btn-toggle-pass"
              id="togglePassword"
              aria-label="Mostrar contraseña"
            >
              <i class="ri-eye-line"></i>
            </button>
          </div>
        </div>

        <div
          id="errorMsg"
          class="error-msg"
          style="display:none;"
        ></div>

        <button type="submit" class="btn-auth" id="loginBtn">
          <span>Entrar</span>
          <i class="ri-arrow-right-line"></i>
        </button>

      </form>

      <div class="auth-switch">
        ¿No tienes una cuenta?
        <a href="/register.html">Crear cuenta</a>
      </div>

    </div>

  </main>

  <script>
    const form = document.getElementById("loginForm");
    const password = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");
    const errorMsg = document.getElementById("errorMsg");
    const loginBtn = document.getElementById("loginBtn");

    togglePassword.addEventListener("click", () => {
      const isPassword = password.type === "password";

      password.type = isPassword ? "text" : "password";

      togglePassword.innerHTML = isPassword
        ? '<i class="ri-eye-off-line"></i>'
        : '<i class="ri-eye-line"></i>';

      togglePassword.setAttribute(
        "aria-label",
        isPassword ? "Ocultar contraseña" : "Mostrar contraseña"
      );
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      errorMsg.style.display = "none";

      const email = document.getElementById("email").value.trim();
      const passwordValue = password.value;

      loginBtn.disabled = true;
      loginBtn.innerHTML = `
        <span>Entrando...</span>
        <i class="ri-loader-4-line"></i>
      `;

      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email,
            password: passwordValue
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || data.error || "No se pudo iniciar sesión.");
        }

        if (data.token) {
          localStorage.setItem("token", data.token);
        }

        window.location.href = "/";
      } catch (error) {
        errorMsg.textContent = error.message;
        errorMsg.style.display = "block";
      } finally {
        loginBtn.disabled = false;

        loginBtn.innerHTML = `
          <span>Entrar</span>
          <i class="ri-arrow-right-line"></i>
        `;
      }
    });
  </script>

</body>
</html>

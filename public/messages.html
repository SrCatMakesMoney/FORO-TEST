<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Foro Ubre — Mensajes</title>

  <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="messages.css">
  <link rel="stylesheet" href="notifications.css">

<style id="foroubre-call-base">
.chat-call-actions{display:flex;align-items:center;gap:6px;margin-left:auto}
.chat-call-btn,.chat-more{width:38px;height:38px;border:0;border-radius:12px;background:rgba(255,255,255,.055);color:#e9edf2;display:grid;place-items:center;cursor:pointer;font-size:18px;transition:.18s ease}
.chat-call-btn:hover,.chat-more:hover{background:rgba(255,255,255,.11);transform:translateY(-1px)}
.call-overlay{position:fixed;inset:0;z-index:99999;background:rgba(3,5,7,.78);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);display:grid;place-items:center;padding:18px}
.call-card{width:min(520px,100%);border:1px solid rgba(255,255,255,.1);border-radius:28px;background:linear-gradient(145deg,rgba(27,30,34,.98),rgba(8,10,12,.98));box-shadow:0 30px 100px rgba(0,0,0,.6);padding:22px;color:#fff}
.call-card.video{width:min(760px,100%);padding:12px;overflow:hidden}
.call-top{display:flex;align-items:center;gap:12px}.call-avatar{width:54px;height:54px;border-radius:17px;object-fit:cover;background:#171a1e}.call-name{font-weight:800}.call-status{font-size:12px;color:#9da4ad;margin-top:3px}.call-video-wrap{position:relative;aspect-ratio:16/10;background:#050607;border-radius:22px;overflow:hidden}.call-remote{width:100%;height:100%;object-fit:cover;background:#050607}.call-local{position:absolute;right:14px;bottom:14px;width:130px;aspect-ratio:3/4;object-fit:cover;border-radius:16px;border:1px solid rgba(255,255,255,.18);background:#111}.call-controls{display:flex;justify-content:center;gap:10px;margin-top:18px}.call-control{width:48px;height:48px;border:0;border-radius:16px;background:rgba(255,255,255,.08);color:#fff;font-size:19px;cursor:pointer}.call-control.end{background:#d83d55}.call-incoming-actions{display:flex;justify-content:center;gap:10px;margin-top:22px}.call-action{border:0;border-radius:14px;padding:12px 18px;font-weight:800;cursor:pointer}.call-action.reject{background:#292d33;color:#fff}.call-action.accept{background:#67df80;color:#07100a}.call-message{margin:10px 0;padding:12px 14px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.035);border-radius:15px;color:#aeb4bc;font-size:12px}.call-message strong{display:block;color:#e9edf2;font-size:13px;margin-bottom:3px}
@media(max-width:700px){.call-overlay{padding:10px}.call-card{border-radius:22px}.call-card.video{padding:8px}.call-local{width:105px;right:10px;bottom:10px}.chat-call-btn,.chat-more{width:34px;height:34px}}
</style>
</head>
<script src="notifications.js"></script>
<body>

  <!-- =========================================================
       BACKGROUND
  ========================================================== -->

  <div class="carbon-bg"></div>

  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>


  <!-- =========================================================
       APP
  ========================================================== -->

  <div class="app-layout">


    <!-- =======================================================
         SIDEBAR
    ======================================================== -->

    <aside class="sidebar">

      <div class="sidebar-top">

        <a href="/" class="brand">

          <span class="brand-icon">
            <i class="ri-leaf-fill"></i>
          </span>

          <span class="brand-name">
            Foro Ubre
          </span>

        </a>


        <nav class="main-nav">

          <a href="/" class="nav-item">

            <span class="nav-icon">
              <i class="ri-home-5-line"></i>
            </span>

            <span class="nav-label">
              Inicio
            </span>

          </a>


          <a href="explorer.html" class="nav-item">

            <span class="nav-icon">
              <i class="ri-search-line"></i>
            </span>

            <span class="nav-label">
              Explorar
            </span>

          </a>


          <a href="videos.html" class="nav-item">

            <span class="nav-icon">
              <i class="ri-play-circle-line"></i>
            </span>

            <span class="nav-label">
              Videos
            </span>

          </a>


          <a href="messages.html" class="nav-item active">

            <span class="nav-icon">
              <i class="ri-message-3-fill"></i>
            </span>

            <span class="nav-label">
              Mensajes
            </span>

          </a>


          <a href="#" class="nav-item" id="navPerfil">

            <span class="nav-icon">
              <i class="ri-user-3-line"></i>
            </span>

            <span class="nav-label">
              Perfil
            </span>

          </a>

        </nav>


        <button
          class="new-post-button"
          onclick="window.location.href='/'"
        >

          <span class="new-post-icon">
            <i class="ri-quill-pen-line"></i>
          </span>

          <span>
            Nuevo post
          </span>

        </button>

      </div>


      <!-- =====================================================
           USER
      ====================================================== -->

      <div
        class="sidebar-user"
        id="sidebarUser"
      ></div>

    </aside>



    <!-- =======================================================
         MESSAGES
    ======================================================== -->

    <main class="messages-main">

      <div class="messages-layout">


        <!-- ===================================================
             CONVERSATIONS
        ==================================================== -->

        <section class="conv-panel">


          <!-- HEADER -->

          <header class="conv-header">

            <div class="conv-title">

              <span class="section-eyebrow">
                <span class="live-dot"></span>
                PRIVADO
              </span>

              <h1>
                Mensajes
              </h1>

            </div>


            <button
              class="btn-nueva-conv"
              id="btnNuevaConv"
              title="Nueva conversación"
              aria-label="Nueva conversación"
            >

              <i class="ri-edit-2-line"></i>

            </button>

          </header>



          <!-- =================================================
               SEARCH USER
          ================================================== -->

          <div
            class="search-user-box hidden"
            id="searchUserBox"
          >

            <div class="message-search">

              <span class="message-search-icon">
                <i class="ri-search-line"></i>
              </span>

              <input
                type="text"
                id="searchUserInput"
                placeholder="Buscar usuario para chatear..."
                autocomplete="off"
                spellcheck="false"
              >

              <button
                type="button"
                class="close-search"
                onclick="
                  document.getElementById('searchUserBox').classList.add('hidden');
                  document.getElementById('searchUserInput').value='';
                  document.getElementById('searchResults').innerHTML='';
                "
              >

                <i class="ri-close-line"></i>

              </button>

            </div>


            <div
              id="searchResults"
              class="search-results"
            ></div>

          </div>



          <!-- =================================================
               CONVERSATIONS LIST
          ================================================== -->

          <div
            id="convList"
            class="conv-list"
          >

            <div class="loading">

              <span class="loading-spinner"></span>

              <span>
                Cargando conversaciones...
              </span>

            </div>

          </div>

        </section>



        <!-- ===================================================
             CHAT
        ==================================================== -->

        <section
          class="chat-panel"
          id="chatPanel"
        >

          <div class="chat-empty">

            <div class="empty-icon">

              <i class="ri-message-3-line"></i>

            </div>

            <h2>
              Tus mensajes
            </h2>

            <p>
              Selecciona una conversación para empezar a chatear.
            </p>

            <button
              class="empty-new-chat"
              onclick="document.getElementById('btnNuevaConv').click()"
            >

              <i class="ri-edit-2-line"></i>

              Nueva conversación

            </button>

          </div>

        </section>

      </div>

    </main>

  </div>



  <!-- =========================================================
       MOBILE NAVIGATION
  ========================================================== -->

  <nav class="bottom-nav">

    <div class="bottom-nav-inner">


      <a
        href="/"
        class="bottom-nav-btn"
      >

        <span class="bn-icon">
          <i class="ri-home-5-line"></i>
        </span>

        <span>
          Inicio
        </span>

      </a>


      <a
        href="explorer.html"
        class="bottom-nav-btn"
      >

        <span class="bn-icon">
          <i class="ri-search-line"></i>
        </span>

        <span>
          Explorar
        </span>

      </a>


      <a
        href="messages.html"
        class="bottom-nav-btn active"
      >

        <span class="bn-icon">
          <i class="ri-message-3-fill"></i>
        </span>

        <span>
          Mensajes
        </span>

      </a>


      <a
        href="#"
        class="bottom-nav-btn"
        id="bnPerfil"
      >

        <span class="bn-icon">
          <i class="ri-user-3-line"></i>
        </span>

        <span>
          Perfil
        </span>

      </a>

    </div>

  </nav>



  <!-- =========================================================
       SOCKET.IO
  ========================================================== -->

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>


  <!-- =========================================================
       ORIGINAL JAVASCRIPT
       LÓGICA DEL CHAT CONSERVADA
  ========================================================== -->

  <script>

    const API = "/api";

    const token =
      localStorage.getItem("fu_token");

    const yo =
      JSON.parse(
        localStorage.getItem("fu_usuario") || "null"
      );


    if (!token || !yo) {
      window.location.href = "/login.html";
    }



    /* =========================================================
       NAV
    ========================================================== */

    document.getElementById("navPerfil").href =
      `profile.html?handle=${yo.handle}`;

    document.getElementById("bnPerfil").href =
      `profile.html?handle=${yo.handle}`;



    /* =========================================================
       SIDEBAR USER
    ========================================================== */

    const avatarSidebarHTML =
      yo.avatarTipo === "video"

        ? `
          <video
            src="${yo.avatar}"
            autoplay
            loop
            muted
            playsinline
            class="sidebar-avatar"
          ></video>
        `

        : `
          <img
            src="${yo.avatar}"
            class="sidebar-avatar"
            alt=""
          >
        `;


    document.getElementById("sidebarUser").innerHTML = `

      ${avatarSidebarHTML}

      <div class="sidebar-user-info">

        <strong>
          ${escHtml(yo.nombre)}
        </strong>

        <small>
          @${escHtml(yo.handle)}
        </small>

      </div>

      <i class="ri-more-2-fill sidebar-user-more"></i>

    `;



    /* =========================================================
       ESTADO
    ========================================================== */

    let convActiva = null;

    let destinatarioId = null;

    let escribiendoTimer = null;



    /* =========================================================
       SOCKET.IO
    ========================================================== */

    const socket = io();


    socket.emit(
      "registrar",
      yo._id
    );


    socket.on(
      "nuevoMensaje",
      ({ convId, mensaje }) => {

        if (convActiva === convId) {

          renderMensaje(mensaje);

          scrollChat();

        } else {

          const item =
            document.querySelector(
              `[data-conv="${convId}"]`
            );


          if (item) {

            let badge =
              item.querySelector(
                ".badge-noLeidos"
              );


            if (!badge) {

              badge =
                document.createElement("span");

              badge.className =
                "badge-noLeidos";

              item.appendChild(badge);

            }


            badge.textContent =
              parseInt(
                badge.textContent || "0"
              ) + 1;

          }

        }


        cargarConversaciones();

      }
    );



    socket.on(
      "usuarioEscribiendo",
      ({ convId, nombre }) => {

        if (convActiva === convId) {

          const el =
            document.getElementById(
              "escribiendoIndicador"
            );


          if (el) {

            el.innerHTML = `

              <span class="typing-dots">
                <i></i>
                <i></i>
                <i></i>
              </span>

              ${escHtml(nombre)}
              está escribiendo...

            `;

          }

        }

      }
    );



    socket.on(
      "usuarioDejoEscribir",
      ({ convId }) => {

        if (convActiva === convId) {

          const el =
            document.getElementById(
              "escribiendoIndicador"
            );


          if (el) {
            el.innerHTML = "";
          }

        }

      }
    );



    /* =========================================================
       CARGAR CONVERSACIONES
    ========================================================== */

    async function cargarConversaciones() {

      try {

        const res =
          await fetch(
            `${API}/messages`,
            {
              headers: {
                Authorization:
                  `Bearer ${token}`
              }
            }
          );


        const data =
          await res.json();


        renderConvList(data);

      }

      catch (e) {

        console.error(e);

      }

    }



    /* =========================================================
       RENDER CONVERSACIONES
    ========================================================== */

    function renderConvList(convs) {

      const list =
        document.getElementById(
          "convList"
        );


      if (!convs || convs.length === 0) {

        list.innerHTML = `

          <div class="no-conversations">

            <div class="no-conversations-icon">
              <i class="ri-message-3-line"></i>
            </div>

            <strong>
              Sin conversaciones
            </strong>

            <span>
              Empieza una nueva conversación.
            </span>

            <button
              onclick="document.getElementById('btnNuevaConv').click()"
            >
              <i class="ri-edit-2-line"></i>
              Nueva conversación
            </button>

          </div>

        `;

        return;

      }



      list.innerHTML =
        convs.map(c => {

          const otro =
            c.participantes.find(
              p => p._id !== yo._id
            );


          if (!otro) return "";


          const ult =
            c.ultimoMensaje;


          const texto =
            ult

              ? (
                  ult.remitente?._id === yo._id
                    ? "Tú: "
                    : ""
                )

                +

                ult.contenido.substring(
                  0,
                  38
                )

                +

                (
                  ult.contenido.length > 38
                    ? "..."
                    : ""
                )

              : "Iniciar conversación";


          const activo =
            convActiva === c._id
              ? "activa"
              : "";


          const badge =
            c.noLeidos > 0

              ? `
                <span class="badge-noLeidos">
                  ${c.noLeidos}
                </span>
              `

              : "";


          const avatarHTML =
            otro.avatarTipo === "video"

              ? `
                <video
                  src="${otro.avatar}"
                  autoplay
                  loop
                  muted
                  playsinline
                  class="avatar"
                ></video>
              `

              : `
                <img
                  src="${otro.avatar}"
                  class="avatar"
                  alt=""
                >
              `;


          return `

            <div
              class="conv-item ${activo}"
              data-conv="${c._id}"
              onclick="abrirConv(
                '${c._id}',
                '${otro._id}',
                '${escHtml(otro.nombre)}',
                '${otro.avatar}',
                '${otro.avatarTipo || "imagen"}',
                '${escHtml(otro.handle)}'
              )"
            >

              <div class="conv-avatar-wrap">

                ${avatarHTML}

                ${
                  c.noLeidos > 0
                    ? `<span class="online-dot"></span>`
                    : ""
                }

              </div>


              <div class="conv-info">

                <div class="conv-name-row">

                  <strong>
                    ${escHtml(otro.nombre)}
                  </strong>

                </div>


                <small>
                  @${escHtml(otro.handle)}
                </small>


                <p class="conv-ultimo">
                  ${escHtml(texto)}
                </p>

              </div>


              ${badge}

            </div>

          `;

        }).join("");


      if (convActiva) {

        document
          .querySelector(
            `[data-conv="${convActiva}"]`
          )
          ?.classList.add("activa");

      }

    }



    /* =========================================================
       ABRIR CONVERSACIÓN
    ========================================================== */

    async function abrirConv(
      convId,
      otroId,
      otroNombre,
      otroAvatar,
      otroTipo,
      otroHandle
    ) {

      convActiva =
        convId;

      destinatarioId =
        otroId;

      // En móvil, mostrar el panel del chat a pantalla completa.
      document.body.classList.add("chat-open");


      document
        .querySelectorAll(".conv-item")
        .forEach(
          el =>
            el.classList.remove("activa")
        );


      const item =
        document.querySelector(
          `[data-conv="${convId}"]`
        );


      if (item) {

        item.classList.add(
          "activa"
        );

        item
          .querySelector(
            ".badge-noLeidos"
          )
          ?.remove();

      }



      const avatarHTML =
        otroTipo === "video"

          ? `
            <video
              src="${otroAvatar}"
              autoplay
              loop
              muted
              playsinline
              class="avatar chat-avatar"
            ></video>
          `

          : `
            <img
              src="${otroAvatar}"
              class="avatar chat-avatar"
              alt=""
            >
          `;



      document.getElementById(
        "chatPanel"
      ).innerHTML = `

        <div class="chat-header">

          <button
            class="chat-back"
            type="button"
            aria-label="Volver a conversaciones"
            onclick="cerrarChatMobile()"
          >
            <i class="ri-arrow-left-line"></i>
          </button>

          <div class="chat-person">

            ${avatarHTML}

            <div>

              <strong>
                ${escHtml(otroNombre)}
              </strong>

              <a
                href="profile.html?handle=${escHtml(otroHandle)}"
              >
                <i class="ri-user-3-line"></i>
                Ver perfil
              </a>

            </div>

          </div>


          <div class="chat-call-actions">
            <button class="chat-call-btn" id="btnLlamadaAudio" type="button" title="Llamada de voz" aria-label="Llamada de voz">
              <i class="ri-phone-line"></i>
            </button>
            <button class="chat-call-btn" id="btnLlamadaVideo" type="button" title="Videollamada" aria-label="Videollamada">
              <i class="ri-vidicon-line"></i>
            </button>
            <button class="chat-more" type="button" aria-label="Opciones">
              <i class="ri-more-2-fill"></i>
            </button>
          </div>

        </div>


        <div
          class="chat-messages"
          id="chatMessages"
        ></div>


        <div
          class="chat-typing"
          id="escribiendoIndicador"
        ></div>


        <div class="chat-input-area">

          <textarea
            id="chatInput"
            placeholder="Escribe un mensaje..."
            maxlength="1000"
            rows="1"
          ></textarea>


          <button
            id="btnEnviar"
            onclick="enviarMensaje()"
            title="Enviar"
            aria-label="Enviar mensaje"
          >

            <i class="ri-send-plane-fill"></i>

          </button>

        </div>

      `;




      document.getElementById("btnLlamadaAudio")?.addEventListener("click", () => iniciarLlamada("audio"));
      document.getElementById("btnLlamadaVideo")?.addEventListener("click", () => iniciarLlamada("video"));

      /* INPUT */

      const inp =
        document.getElementById(
          "chatInput"
        );


      inp.addEventListener(
        "keydown",
        e => {

          if (
            e.key === "Enter" &&
            !e.shiftKey
          ) {

            e.preventDefault();

            enviarMensaje();

          }

        }
      );


      inp.addEventListener(
        "input",
        () => {

          inp.style.height =
            "auto";

          inp.style.height =
            Math.min(
              inp.scrollHeight,
              120
            ) + "px";


          socket.emit(
            "escribiendo",
            {
              convId,
              nombre: yo.nombre,
              destinatarioId
            }
          );


          clearTimeout(
            escribiendoTimer
          );


          escribiendoTimer =
            setTimeout(
              () => {

                socket.emit(
                  "dejoDeEscribir",
                  {
                    convId,
                    destinatarioId
                  }
                );

              },
              1500
            );

        }
      );


      inp.focus();



      /* MENSAJES */

      try {

        const res =
          await fetch(
            `${API}/messages/${convId}`,
            {
              headers: {
                Authorization:
                  `Bearer ${token}`
              }
            }
          );


        const msgs =
          await res.json();


        msgs.forEach(
          m => renderMensaje(m)
        );


        scrollChat();

      }

      catch (e) {

        console.error(e);

      }


      history.replaceState(
        {},
        "",
        `?conv=${convId}`
      );

    }



    /* =========================================================
       CERRAR CHAT EN MÓVIL
    ========================================================== */

    function cerrarChatMobile() {

      document.body.classList.remove("chat-open");

      convActiva = null;
      destinatarioId = null;

      history.replaceState(
        {},
        "",
        "messages.html"
      );

      document
        .querySelectorAll(".conv-item")
        .forEach(el => el.classList.remove("activa"));
    }



    /* =========================================================
       ENVIAR MENSAJE
    ========================================================== */

    async function enviarMensaje() {

      const inp =
        document.getElementById(
          "chatInput"
        );


      const contenido =
        inp?.value.trim();


      if (
        !contenido ||
        !convActiva
      ) return;


      const btn =
        document.getElementById(
          "btnEnviar"
        );


      if (btn) {
        btn.disabled = true;
      }


      inp.value = "";

      inp.style.height =
        "auto";


      try {

        const res =
          await fetch(
            `${API}/messages/${convActiva}/send`,
            {
              method: "POST",

              headers: {
                Authorization:
                  `Bearer ${token}`,

                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  contenido
                })
            }
          );


        const msg =
          await res.json();


        if (!res.ok) {
          throw new Error(
            msg.mensaje
          );
        }


        socket.emit(
          "enviarMensaje",
          {
            convId:
              convActiva,

            mensaje:
              msg,

            destinatarioId
          }
        );


        renderMensaje(msg);

        scrollChat();

        cargarConversaciones();


        socket.emit(
          "dejoDeEscribir",
          {
            convId:
              convActiva,

            destinatarioId
          }
        );

      }

      catch (e) {

        alert(
          "Error: " +
          e.message
        );

      }

      finally {

        if (btn) {
          btn.disabled = false;
        }


        document
          .getElementById(
            "chatInput"
          )
          ?.focus();

      }

    }



    /* =========================================================
       RENDER MENSAJE
    ========================================================== */

    function renderMensaje(msg) {

      const container =
        document.getElementById(
          "chatMessages"
        );


      if (!container) return;


      if (
        document.getElementById(
          `msg-${msg._id}`
        )
      ) return;


      const esMio =
        msg.remitente._id === yo._id ||
        msg.remitente === yo._id;


      const tiempo =
        tiempoRelativo(
          msg.createdAt
        );


      const el =
        document.createElement(
          "div"
        );


      el.className =
        `mensaje ${esMio ? "mio" : "suyo"}`;


      el.id =
        `msg-${msg._id}`;


      el.innerHTML = `

        <div class="mensaje-burbuja">

          <p>
            ${escHtml(msg.contenido)}
          </p>

          <span class="mensaje-tiempo">

            <i class="ri-time-line"></i>

            ${tiempo}

          </span>

        </div>

      `;


      container.appendChild(el);

    }



    /* =========================================================
       SCROLL
    ========================================================== */

    function scrollChat() {

      const c =
        document.getElementById(
          "chatMessages"
        );


      if (c) {

        c.scrollTop =
          c.scrollHeight;

      }

    }



    /* =========================================================
       NUEVA CONVERSACIÓN
    ========================================================== */

    let searchTimer = null;


    document
      .getElementById(
        "btnNuevaConv"
      )
      .addEventListener(
        "click",
        () => {

          const box =
            document.getElementById(
              "searchUserBox"
            );


          box.classList.toggle(
            "hidden"
          );


          if (
            !box.classList.contains(
              "hidden"
            )
          ) {

            document
              .getElementById(
                "searchUserInput"
              )
              .focus();

          }

        }
      );



    document
      .getElementById(
        "searchUserInput"
      )
      .addEventListener(
        "input",
        function() {

          clearTimeout(
            searchTimer
          );


          searchTimer =
            setTimeout(
              () =>
                buscarUsuarios(
                  this.value.trim()
                ),
              400
            );

        }
      );



    /* =========================================================
       BUSCAR USUARIOS
    ========================================================== */

    async function buscarUsuarios(q) {

      const box =
        document.getElementById(
          "searchResults"
        );


      if (q.length < 2) {

        box.innerHTML =
          "";

        return;

      }


      try {

        const res =
          await fetch(
            `${API}/profile/search?q=${encodeURIComponent(q)}`,
            {
              headers: {
                Authorization:
                  `Bearer ${token}`
              }
            }
          );


        const data =
          await res.json();


        if (!data.length) {

          box.innerHTML = `

            <div class="search-empty">

              <div class="search-empty-icon">
                <i class="ri-user-search-line"></i>
              </div>

              <span>
                Sin resultados
              </span>

            </div>

          `;

          return;

        }



        box.innerHTML =
          data.map(u => {

            const avHTML =
              u.avatarTipo === "video"

                ? `
                  <video
                    src="${u.avatar}"
                    autoplay
                    loop
                    muted
                    playsinline
                    class="avatar-sm"
                  ></video>
                `

                : `
                  <img
                    src="${u.avatar}"
                    class="avatar-sm"
                    alt=""
                  >
                `;


            return `

              <div
                class="search-result-item"
                onclick="iniciarChatConUsuario('${u._id}')"
              >

                ${avHTML}


                <div class="search-result-info">

                  <strong>
                    ${escHtml(u.nombre)}
                  </strong>

                  <small>
                    @${escHtml(u.handle)}
                  </small>

                </div>


                <span class="search-result-arrow">

                  <i class="ri-arrow-right-s-line"></i>

                </span>

              </div>

            `;

          }).join("");

      }

      catch (e) {}

    }



    /* =========================================================
       INICIAR CHAT
    ========================================================== */

    async function iniciarChatConUsuario(userId) {

      document
        .getElementById(
          "searchUserBox"
        )
        .classList.add(
          "hidden"
        );


      document
        .getElementById(
          "searchUserInput"
        )
        .value =
          "";


      document
        .getElementById(
          "searchResults"
        )
        .innerHTML =
          "";


      try {

        const res =
          await fetch(
            `${API}/messages`,
            {
              method: "POST",

              headers: {
                Authorization:
                  `Bearer ${token}`,

                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  usuarioId:
                    userId
                })
            }
          );


        const conv =
          await res.json();


        if (!res.ok) {

          throw new Error(
            conv.mensaje
          );

        }


        await cargarConversaciones();


        const otro =
          conv.participantes.find(
            p => p._id !== yo._id
          );


        if (otro) {

          abrirConv(
            conv._id,
            otro._id,
            otro.nombre,
            otro.avatar,
            otro.avatarTipo || "imagen",
            otro.handle
          );

        }

      }

      catch (e) {

        alert(
          e.message
        );

      }

    }



    /* =========================================================
       UTILS
    ========================================================== */

    function escHtml(str = "") {

      return String(str)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        );

    }



    function tiempoRelativo(fecha) {

      const d =
        (Date.now() -
          new Date(fecha))
        / 1000;


      if (d < 60) {
        return "ahora";
      }


      if (d < 3600) {

        return `${Math.floor(d / 60)}m`;

      }


      if (d < 86400) {

        return `${Math.floor(d / 3600)}h`;

      }


      return new Date(fecha)
        .toLocaleDateString(
          "es",
          {
            day: "numeric",
            month: "short"
          }
        );

    }



    /* =========================================================
       INIT
    ========================================================== */

    cargarConversaciones();



    /* =========================================================
       ABRIR CONVERSACIÓN DESDE URL
    ========================================================== */

    const convParam =
      new URLSearchParams(
        location.search
      ).get("conv");


    if (convParam) {

      setTimeout(
        async () => {

          try {

            const res =
              await fetch(
                `${API}/messages`,
                {
                  headers: {
                    Authorization:
                      `Bearer ${token}`
                  }
                }
              );


            const convs =
              await res.json();


            const conv =
              convs.find(
                c =>
                  c._id ===
                  convParam
              );


            if (conv) {

              const otro =
                conv.participantes.find(
                  p =>
                    p._id !== yo._id
                );


              if (otro) {

                abrirConv(
                  conv._id,
                  otro._id,
                  otro.nombre,
                  otro.avatar,
                  otro.avatarTipo ||
                    "imagen",
                  otro.handle
                );

              }

            }

          }

          catch (e) {}

        },
        600
      );

    }

  

    /* =========================================================
       FORO UBRE — LLAMADAS AUDIO / VIDEO (WebRTC)
       ========================================================= */
    const CALL_ICE = [{ urls: "stun:stun.l.google.com:19302" }];
    let llamada = { pc:null, stream:null, remoteStream:null, tipo:null, convId:null, peerSocketId:null, caller:false, iceQueue:[], connected:false };

    function callSafeText(v){ return escHtml(String(v ?? "")); }

    function callDialog(html, extraClass=""){
      document.getElementById("foroCallOverlay")?.remove();
      const o=document.createElement("div"); o.id="foroCallOverlay"; o.className=`call-overlay ${extraClass}`; o.innerHTML=html; document.body.appendChild(o); return o;
    }
    function closeCallUI(){ document.getElementById("foroCallOverlay")?.remove(); }
    function addCallMessage(title,status){
      const box=document.getElementById("chatMessages"); if(!box) return;
      const d=document.createElement("div"); d.className="call-message"; d.innerHTML=`<strong>${callSafeText(title)}</strong><span>${callSafeText(status)}</span>`; box.appendChild(d); scrollChat();
    }
    function localMediaError(err, tipo){
      console.error("FORO UBRE media:",err);
      let msg="No se pudo acceder al micrófono.";
      if(tipo==="video") msg="No se pudo acceder a la cámara o al micrófono.";
      if(err?.name==="NotAllowedError"||err?.name==="PermissionDeniedError") msg="Permiso bloqueado. En Android abre los permisos del sitio y permite Cámara y Micrófono; después recarga Foro Ubre.";
      else if(err?.name==="NotFoundError") msg="No se encontró una cámara o micrófono disponible.";
      else if(err?.name==="SecurityError") msg="El navegador bloqueó cámara/micrófono por seguridad. Usa HTTPS.";
      else if(!window.isSecureContext) msg="Cámara y micrófono requieren HTTPS.";
      alert(msg);
    }
    async function obtenerMedia(tipo){
      if(!window.isSecureContext){ throw Object.assign(new Error("HTTPS requerido"),{name:"SecurityError"}); }
      if(!navigator.mediaDevices?.getUserMedia){ throw Object.assign(new Error("getUserMedia no disponible"),{name:"SecurityError"}); }
      const constraints = tipo==="video" ? {audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:{facingMode:"user",width:{ideal:1280},height:{ideal:720}}} : {audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}};
      return navigator.mediaDevices.getUserMedia(constraints);
    }
    function crearPeer(){
      const pc=new RTCPeerConnection({iceServers:CALL_ICE});
      pc.onicecandidate=e=>{ if(e.candidate && llamada.peerSocketId) socket.emit("llamada:signal",{targetSocketId:llamada.peerSocketId,kind:"ice",data:e.candidate,convId:llamada.convId}); };
      pc.ontrack=e=>{ llamada.remoteStream ||= new MediaStream(); e.streams?.[0]?.getTracks().forEach(t=>llamada.remoteStream.addTrack(t)); const v=document.getElementById("callRemote"); if(v) v.srcObject=llamada.remoteStream; };
      pc.onconnectionstatechange=()=>{
        if(pc.connectionState==="connected"){ llamada.connected=true; document.getElementById("callStatus")?.replaceChildren(document.createTextNode("Conectada")); }
        if(["failed","closed","disconnected"].includes(pc.connectionState) && llamada.connected){ finalizarLlamada("conexión perdida",false); }
      };
      return pc;
    }
    async function prepararLlamadaMedia(tipo){
      llamada.stream=await obtenerMedia(tipo);
      llamada.remoteStream=new MediaStream();
      llamada.pc=crearPeer(); llamada.stream.getTracks().forEach(t=>llamada.pc.addTrack(t,llamada.stream));
      const local=document.getElementById("callLocal"); if(local){ local.srcObject=llamada.stream; local.muted=true; }
    }
    function mostrarLlamada(tipo,nombre,entrante=false){
      const video=tipo==="video";
      const overlay=callDialog(video ? `<div class="call-card video"><div class="call-video-wrap"><video id="callRemote" class="call-remote" autoplay playsinline></video><video id="callLocal" class="call-local" autoplay muted playsinline></video></div><div class="call-top" style="margin-top:12px"><div class="call-avatar"><i class="ri-vidicon-line"></i></div><div><div class="call-name">${callSafeText(nombre)}</div><div class="call-status" id="callStatus">${entrante?"Videollamada entrante":"Llamando…"}</div></div></div><div class="call-controls">${entrante?`<button class="call-control end" id="callReject"><i class="ri-close-line"></i></button><button class="call-control" id="callAccept"><i class="ri-phone-line"></i></button>`:`<button class="call-control end" id="callHang"><i class="ri-phone-off-line"></i></button>`}</div></div>` : `<div class="call-card"><div class="call-top"><div class="call-avatar"><i class="ri-phone-line"></i></div><div><div class="call-name">${callSafeText(nombre)}</div><div class="call-status" id="callStatus">${entrante?"Llamada entrante":"Llamando…"}</div></div></div><div class="call-controls">${entrante?`<button class="call-control end" id="callReject"><i class="ri-close-line"></i></button><button class="call-control" id="callAccept"><i class="ri-phone-line"></i></button>`:`<button class="call-control end" id="callHang"><i class="ri-phone-off-line"></i></button>`}</div></div>`);
      if(entrante){ document.getElementById("callReject")?.addEventListener("click",()=>rechazarLlamada()); document.getElementById("callAccept")?.addEventListener("click",()=>aceptarLlamada()); }
      else document.getElementById("callHang")?.addEventListener("click",()=>finalizarLlamada("cancelada",true));
      return overlay;
    }
    async function iniciarLlamada(tipo){
      if(!convActiva||!destinatarioId) return;
      if(llamada.pc){ alert("Ya tienes una llamada activa."); return; }
      try{
        // IMPORTANTE: getUserMedia ocurre directamente después del toque del usuario en Android.
        await prepararLlamadaMedia(tipo);
        llamada={...llamada,tipo,convId:convActiva,caller:true,connected:false,peerSocketId:null};
        // El socket del receptor no es necesario: el servidor enruta por userId.
        mostrarLlamada(tipo,document.querySelector(".chat-person strong")?.textContent?.trim()||"Usuario",false);
        socket.emit("llamada:invitar",{destinatarioId,convId:convActiva,tipo,emisor:yo});
        addCallMessage(tipo==="video"?"Videollamada":"Llamada de voz","Llamando…");
        setTimeout(()=>{ if(llamada.pc && !llamada.connected && llamada.caller) finalizarLlamada("sin respuesta",true); },30000);
      }catch(e){ localMediaError(e,tipo); limpiarLlamada(); }
    }
    async function aceptarLlamada(){
      if(!llamada.pc||!llamada.stream){
        try{ await prepararLlamadaMedia(llamada.tipo); }catch(e){ localMediaError(e,llamada.tipo); socket.emit("llamada:respuesta",{callerSocketId:llamada.peerSocketId,convId:llamada.convId,aceptada:false,motivo:e.name||"permiso"}); limpiarLlamada(); return; }
      }
      document.getElementById("callStatus")?.replaceChildren(document.createTextNode("Conectando…"));
      socket.emit("llamada:respuesta",{callerSocketId:llamada.peerSocketId,convId:llamada.convId,aceptada:true});
      // El llamante crea el offer después de recibir aceptación.
    }
    function rechazarLlamada(){ if(llamada.peerSocketId) socket.emit("llamada:respuesta",{callerSocketId:llamada.peerSocketId,convId:llamada.convId,aceptada:false,motivo:"rechazada"}); addCallMessage(llamada.tipo==="video"?"Videollamada":"Llamada de voz","Rechazada"); limpiarLlamada(); }
    async function crearOffer(){ const offer=await llamada.pc.createOffer(); await llamada.pc.setLocalDescription(offer); socket.emit("llamada:signal",{targetSocketId:llamada.peerSocketId,kind:"offer",data:offer,convId:llamada.convId}); }
    async function procesarSignal(msg){
      if(!llamada.pc) return;
      if(msg.kind==="offer"){
        await llamada.pc.setRemoteDescription(msg.data); const answer=await llamada.pc.createAnswer(); await llamada.pc.setLocalDescription(answer); socket.emit("llamada:signal",{targetSocketId:msg.fromSocketId,kind:"answer",data:answer,convId:llamada.convId});
      }else if(msg.kind==="answer") await llamada.pc.setRemoteDescription(msg.data);
      else if(msg.kind==="ice"){
        if(llamada.pc.remoteDescription) await llamada.pc.addIceCandidate(msg.data); else llamada.iceQueue.push(msg.data);
      }
      if(llamada.pc.remoteDescription && llamada.iceQueue.length){ const q=[...llamada.iceQueue]; llamada.iceQueue=[]; for(const c of q){try{await llamada.pc.addIceCandidate(c)}catch{}} }
    }
    function limpiarLlamada(){
      llamada.stream?.getTracks().forEach(t=>t.stop()); llamada.remoteStream?.getTracks().forEach(t=>t.stop()); try{llamada.pc?.close()}catch{}
      llamada={pc:null,stream:null,remoteStream:null,tipo:null,convId:null,peerSocketId:null,caller:false,iceQueue:[],connected:false}; closeCallUI();
    }
    function finalizarLlamada(motivo="finalizada",notificar=true){ const target=llamada.peerSocketId; const cid=llamada.convId; if(notificar&&target) socket.emit("llamada:finalizar",{targetSocketId:target,convId:cid,motivo}); addCallMessage(cid&&llamada.tipo==="video"?"Videollamada":"Llamada de voz",motivo); limpiarLlamada(); }

    socket.on("llamada:entrante", data=>{
      if(llamada.pc){ socket.emit("llamada:respuesta",{callerSocketId:data.callerSocketId,convId:data.convId,aceptada:false,motivo:"ocupado"}); return; }
      llamada={pc:null,stream:null,remoteStream:null,tipo:data.tipo,convId:data.convId,peerSocketId:data.callerSocketId,caller:false,iceQueue:[],connected:false};
      mostrarLlamada(data.tipo,data.emisor?.nombre||"Usuario",true);
      if(convActiva!==data.convId){ cargarConversaciones(); }
      addCallMessage(data.tipo==="video"?"Videollamada":"Llamada de voz","Llamada entrante");
    });
    socket.on("llamada:respuesta",async data=>{
      if(!llamada.pc||llamada.convId!==data.convId) return;
      if(!data.aceptada){ addCallMessage(llamada.tipo==="video"?"Videollamada":"Llamada de voz",data.motivo||"No aceptada"); limpiarLlamada(); return; }
      document.getElementById("callStatus")?.replaceChildren(document.createTextNode("Conectando…"));
      // El socket del receptor viene en la respuesta solo indirectamente: usamos el room socketId no disponible.
      // Se resuelve solicitando señal al servidor mediante un evento de enlace.
      socket.emit("llamada:signalTarget",{destinatarioId,convId:llamada.convId});
    });
    socket.on("llamada:signalTarget", async ({targetSocketId,convId})=>{ if(llamada.caller&&llamada.convId===convId){ llamada.peerSocketId=targetSocketId; await crearOffer(); } });
    socket.on("llamada:signal", async msg=>{ if(!llamada.convId) return; if(!llamada.peerSocketId) llamada.peerSocketId=msg.fromSocketId; if(llamada.convId===msg.convId) { try{ await procesarSignal(msg); }catch(e){ console.error("WebRTC signal",e); } } });
    socket.on("llamada:finalizada", data=>{ if(llamada.convId===data.convId){ addCallMessage(llamada.tipo==="video"?"Videollamada":"Llamada de voz",data.motivo||"Finalizada"); limpiarLlamada(); } });
</script>

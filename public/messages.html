  <!-- =========================================================
       ORIGINAL JAVASCRIPT
       LÓGICA DEL CHAT CONSERVADA
  ========================================================== -->

  <script>

    const API = "/api";

    const token =
      localStorage.getItem("fu_token");

    const yo =
      JSON.parse(
        localStorage.getItem("fu_usuario") || "null"
      );


    if (!token || !yo) {
      window.location.href = "/login.html";
    }



    /* =========================================================
       NAV
    ========================================================== */

    document.getElementById("navPerfil").href =
      `profile.html?handle=${yo.handle}`;

    document.getElementById("bnPerfil").href =
      `profile.html?handle=${yo.handle}`;



    /* =========================================================
       SIDEBAR USER
    ========================================================== */

    const avatarSidebarHTML =
      yo.avatarTipo === "video"

        ? `
          <video
            src="${yo.avatar}"
            autoplay
            loop
            muted
            playsinline
            class="sidebar-avatar"
          ></video>
        `

        : `
          <img
            src="${yo.avatar}"
            class="sidebar-avatar"
            alt=""
          >
        `;


    document.getElementById("sidebarUser").innerHTML = `

      ${avatarSidebarHTML}

      <div class="sidebar-user-info">

        <strong>
          ${escHtml(yo.nombre)}
        </strong>

        <small>
          @${escHtml(yo.handle)}
        </small>

      </div>

      <i class="ri-more-2-fill sidebar-user-more"></i>

    `;



    /* =========================================================
       ESTADO
    ========================================================== */

    let convActiva = null;

    let destinatarioId = null;

    let escribiendoTimer = null;

    // =========================================================
    // LLAMADAS / WEBRTC
    // =========================================================
    const usuariosLlamada = new Map();
    const ICE_SERVERS = [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" }
    ];

    let llamada = {
      activa: false,
      callId: null,
      tipo: null,
      role: null,
      peerId: null,
      nombre: "",
      avatar: "",
      avatarTipo: "imagen",
      peer: null,
      localStream: null,
      remoteStream: null,
      pendingCandidates: []
    };



    /* =========================================================
       SOCKET.IO
    ========================================================== */

    const socket = io();


    socket.emit(
      "registrar",
      yo._id
    );


    socket.on(
      "nuevoMensaje",
      ({ convId, mensaje }) => {

        if (convActiva === convId) {

          renderMensaje(mensaje);

          scrollChat();

        } else {

          const item =
            document.querySelector(
              `[data-conv="${convId}"]`
            );


          if (item) {

            let badge =
              item.querySelector(
                ".badge-noLeidos"
              );


            if (!badge) {

              badge =
                document.createElement("span");

              badge.className =
                "badge-noLeidos";

              item.appendChild(badge);

            }


            badge.textContent =
              parseInt(
                badge.textContent || "0"
              ) + 1;

          }

        }


        cargarConversaciones();

      }
    );



    socket.on(
      "usuarioEscribiendo",
      ({ convId, nombre }) => {

        if (convActiva === convId) {

          const el =
            document.getElementById(
              "escribiendoIndicador"
            );


          if (el) {

            el.innerHTML = `

              <span class="typing-dots">
                <i></i>
                <i></i>
                <i></i>
              </span>

              ${escHtml(nombre)}
              está escribiendo...

            `;

          }

        }

      }
    );



    socket.on(
      "usuarioDejoEscribir",
      ({ convId }) => {

        if (convActiva === convId) {

          const el =
            document.getElementById(
              "escribiendoIndicador"
            );


          if (el) {
            el.innerHTML = "";
          }

        }

      }
    );


    // =========================================================
    // EVENTOS DE LLAMADA
    // =========================================================

    socket.on("llamada:entrante", (data) => {
      if (!data?.callId || !data?.callerId) return;

      // Si ya estamos en otra llamada, rechazamos automáticamente.
      if (llamada.activa) {
        socket.emit("llamada:rechazar", {
          callerId: data.callerId,
          callId: data.callId
        });
        return;
      }

      const info = usuariosLlamada.get(String(data.callerId)) || {};

      llamada = {
        ...llamada,
        activa: true,
        callId: String(data.callId),
        tipo: data.tipo === "video" ? "video" : "audio",
        role: "receiver",
        peerId: String(data.callerId),
        nombre: data.callerName || info.nombre || "Usuario",
        avatar: data.callerAvatar || info.avatar || "",
        avatarTipo: data.callerAvatarTipo || info.avatarTipo || "imagen",
        peer: null,
        localStream: null,
        remoteStream: null,
        pendingCandidates: []
      };

      mostrarPanelLlamada("incoming");
    });

    socket.on("llamada:aceptada", async ({ callId, receiverId }) => {
      if (!llamada.activa || llamada.callId !== String(callId)) return;
      if (llamada.role !== "caller") return;

      try {
        actualizarEstadoLlamada("Conectando…");
        await prepararPeer(true);

        const offer = await llamada.peer.createOffer();
        await llamada.peer.setLocalDescription(offer);

        socket.emit("llamada:signal", {
          destinatarioId: receiverId,
          callId: llamada.callId,
          signal: { type: "offer", sdp: offer }
        });
      } catch (error) {
        console.error("Llamada:", error);
        finalizarLlamadaLocal("No se pudo iniciar la llamada.");
      }
    });

    socket.on("llamada:rechazada", ({ callId }) => {
      if (!llamada.activa || llamada.callId !== String(callId)) return;
      finalizarLlamadaLocal("Llamada rechazada", false);
    });

    socket.on("llamada:finalizada", ({ callId, razon }) => {
      if (!llamada.activa || llamada.callId !== String(callId)) return;
      finalizarLlamadaLocal(
        razon === "rechazada" ? "Llamada rechazada" : "Llamada finalizada",
        false
      );
    });

    socket.on("llamada:signal", async ({ callId, signal }) => {
      if (!llamada.activa || llamada.callId !== String(callId) || !signal) return;

      try {
        if (signal.type === "offer") {
          await prepararPeer(false);
          await llamada.peer.setRemoteDescription(new RTCSessionDescription(signal.sdp));
          await procesarCandidatosPendientes();

          const answer = await llamada.peer.createAnswer();
          await llamada.peer.setLocalDescription(answer);

          socket.emit("llamada:signal", {
            destinatarioId: llamada.peerId,
            callId: llamada.callId,
            signal: { type: "answer", sdp: answer }
          });

          actualizarEstadoLlamada("Conectando…");
          return;
        }

        if (signal.type === "answer") {
          if (!llamada.peer) return;
          await llamada.peer.setRemoteDescription(new RTCSessionDescription(signal.sdp));
          await procesarCandidatosPendientes();
          actualizarEstadoLlamada("Conectado");
          return;
        }

        if (signal.type === "candidate") {
          if (!llamada.peer) return;

          const candidate = new RTCIceCandidate(signal.candidate);

          if (llamada.peer.remoteDescription) {
            await llamada.peer.addIceCandidate(candidate);
          } else {
            llamada.pendingCandidates.push(candidate);
          }
        }
      } catch (error) {
        console.error("WebRTC signal:", error);
        finalizarLlamadaLocal("Se perdió la conexión.");
      }
    });


    /* =========================================================
       CARGAR CONVERSACIONES
    ========================================================== */

    async function cargarConversaciones() {

      try {

        const res =
          await fetch(
            `${API}/messages`,
            {
              headers: {
                Authorization:
                  `Bearer ${token}`
              }
            }
          );


        const data =
          await res.json();


        renderConvList(data);

      }

      catch (e) {

        console.error(e);

      }

    }



    /* =========================================================
       RENDER CONVERSACIONES
    ========================================================== */

    function renderConvList(convs) {

      const list =
        document.getElementById(
          "convList"
        );


      if (!convs || convs.length === 0) {

        list.innerHTML = `

          <div class="no-conversations">

            <div class="no-conversations-icon">
              <i class="ri-message-3-line"></i>
            </div>

            <strong>
              Sin conversaciones
            </strong>

            <span>
              Empieza una nueva conversación.
            </span>

            <button
              onclick="document.getElementById('btnNuevaConv').click()"
            >
              <i class="ri-edit-2-line"></i>
              Nueva conversación
            </button>

          </div>

        `;

        return;

      }



      list.innerHTML =
        convs.map(c => {

          const otro =
            c.participantes.find(
              p => p._id !== yo._id
            );


          if (!otro) return "";

          usuariosLlamada.set(String(otro._id), {
            nombre: otro.nombre || "Usuario",
            avatar: otro.avatar || "",
            avatarTipo: otro.avatarTipo || "imagen",
            handle: otro.handle || ""
          });

          const ult =
            c.ultimoMensaje;


          const texto =
            ult

              ? (
                  ult.remitente?._id === yo._id
                    ? "Tú: "
                    : ""
                )

                +

                ult.contenido.substring(
                  0,
                  38
                )

                +

                (
                  ult.contenido.length > 38
                    ? "..."
                    : ""
                )

              : "Iniciar conversación";


          const activo =
            convActiva === c._id
              ? "activa"
              : "";


          const badge =
            c.noLeidos > 0

              ? `
                <span class="badge-noLeidos">
                  ${c.noLeidos}
                </span>
              `

              : "";


          const avatarHTML =
            otro.avatarTipo === "video"

              ? `
                <video
                  src="${otro.avatar}"
                  autoplay
                  loop
                  muted
                  playsinline
                  class="avatar"
                ></video>
              `

              : `
                <img
                  src="${otro.avatar}"
                  class="avatar"
                  alt=""
                >
              `;


          return `

            <div
              class="conv-item ${activo}"
              data-conv="${c._id}"
              onclick="abrirConv(
                '${c._id}',
                '${otro._id}',
                '${escHtml(otro.nombre)}',
                '${otro.avatar}',
                '${otro.avatarTipo || "imagen"}',
                '${escHtml(otro.handle)}'
              )"
            >

              <div class="conv-avatar-wrap">

                ${avatarHTML}

                ${
                  c.noLeidos > 0
                    ? `<span class="online-dot"></span>`
                    : ""
                }

              </div>


              <div class="conv-info">

                <div class="conv-name-row">

                  <strong>
                    ${escHtml(otro.nombre)}
                  </strong>

                </div>


                <small>
                  @${escHtml(otro.handle)}
                </small>


                <p class="conv-ultimo">
                  ${escHtml(texto)}
                </p>

              </div>


              ${badge}

            </div>

          `;

        }).join("");


      if (convActiva) {

        document
          .querySelector(
            `[data-conv="${convActiva}"]`
          )
          ?.classList.add("activa");

      }

    }



    /* =========================================================
       ABRIR CONVERSACIÓN
    ========================================================== */

    async function abrirConv(
      convId,
      otroId,
      otroNombre,
      otroAvatar,
      otroTipo,
      otroHandle
    ) {

      convActiva =
        convId;

      destinatarioId =
        otroId;

      // En móvil, mostrar el panel del chat a pantalla completa.
      document.body.classList.add("chat-open");


      document
        .querySelectorAll(".conv-item")
        .forEach(
          el =>
            el.classList.remove("activa")
        );


      const item =
        document.querySelector(
          `[data-conv="${convId}"]`
        );


      if (item) {

        item.classList.add(
          "activa"
        );

        item
          .querySelector(
            ".badge-noLeidos"
          )
          ?.remove();

      }



      const avatarHTML =
        otroTipo === "video"

          ? `
            <video
              src="${otroAvatar}"
              autoplay
              loop
              muted
              playsinline
              class="avatar chat-avatar"
            ></video>
          `

          : `
            <img
              src="${otroAvatar}"
              class="avatar chat-avatar"
              alt=""
            >
          `;



      document.getElementById(
        "chatPanel"
      ).innerHTML = `

        <div class="chat-header">

          <button
            class="chat-back"
            type="button"
            aria-label="Volver a conversaciones"
            onclick="cerrarChatMobile()"
          >
            <i class="ri-arrow-left-line"></i>
          </button>

          <div class="chat-person">

            ${avatarHTML}

            <div>

              <strong>
                ${escHtml(otroNombre)}
              </strong>

              <a
                href="profile.html?handle=${escHtml(otroHandle)}"
              >
                <i class="ri-user-3-line"></i>
                Ver perfil
              </a>

            </div>

          </div>


          <div class="chat-call-actions">

            <button
              class="chat-call-btn"
              type="button"
              title="Llamada de voz"
              aria-label="Llamada de voz"
              onclick="iniciarLlamada('audio')"
            >
              <i class="ri-phone-line"></i>
            </button>

            <button
              class="chat-call-btn"
              type="button"
              title="Videollamada"
              aria-label="Videollamada"
              onclick="iniciarLlamada('video')"
            >
              <i class="ri-video-add-line"></i>
            </button>

          </div>

          <button
            class="chat-more"
            type="button"
            aria-label="Opciones"
          >
            <i class="ri-more-2-fill"></i>
          </button>

        </div>


        <div
          class="chat-messages"
          id="chatMessages"
        ></div>


        <div
          class="chat-typing"
          id="escribiendoIndicador"
        ></div>


        <div class="chat-input-area">

          <textarea
            id="chatInput"
            placeholder="Escribe un mensaje..."
            maxlength="1000"
            rows="1"
          ></textarea>


          <button
            id="btnEnviar"
            onclick="enviarMensaje()"
            title="Enviar"
            aria-label="Enviar mensaje"
          >

            <i class="ri-send-plane-fill"></i>

          </button>

        </div>

      `;



      /* INPUT */

      const inp =
        document.getElementById(
          "chatInput"
        );


      inp.addEventListener(
        "keydown",
        e => {

          if (
            e.key === "Enter" &&
            !e.shiftKey
          ) {

            e.preventDefault();

            enviarMensaje();

          }

        }
      );


      inp.addEventListener(
        "input",
        () => {

          inp.style.height =
            "auto";

          inp.style.height =
            Math.min(
              inp.scrollHeight,
              120
            ) + "px";


          socket.emit(
            "escribiendo",
            {
              convId,
              nombre: yo.nombre,
              destinatarioId
            }
          );


          clearTimeout(
            escribiendoTimer
          );


          escribiendoTimer =
            setTimeout(
              () => {

                socket.emit(
                  "dejoDeEscribir",
                  {
                    convId,
                    destinatarioId
                  }
                );

              },
              1500
            );

        }
      );


      inp.focus();



      /* MENSAJES */

      try {

        const res =
          await fetch(
            `${API}/messages/${convId}`,
            {
              headers: {
                Authorization:
                  `Bearer ${token}`
              }
            }
          );


        const msgs =
          await res.json();


        msgs.forEach(
          m => renderMensaje(m)
        );


        scrollChat();

      }

      catch (e) {

        console.error(e);

      }


      history.replaceState(
        {},
        "",
        `?conv=${convId}`
      );

    }



    // =========================================================
    // INTERFAZ + WEBRTC
    // =========================================================

    function asegurarPanelLlamada() {
      let panel = document.getElementById("callOverlay");
      if (panel) return panel;

      panel = document.createElement("div");
      panel.id = "callOverlay";
      panel.className = "call-overlay";
      panel.innerHTML = `
        <div class="call-window">
          <div class="call-topbar">
            <div class="call-status-wrap">
              <span class="call-status-dot"></span>
              <span id="callStatus">Llamando…</span>
            </div>
            <button type="button" class="call-close-mini" id="callMinimize" aria-label="Minimizar">
              <i class="ri-subtract-line"></i>
            </button>
          </div>

          <div class="call-stage" id="callStage">
            <div class="call-remote-placeholder" id="callRemotePlaceholder">
              <div class="call-avatar-wrap" id="callAvatarWrap"></div>
              <strong id="callName">Usuario</strong>
              <span id="callTypeLabel">Llamada de voz</span>
            </div>

            <video id="remoteCallVideo" class="call-remote-video" autoplay playsinline></video>
            <video id="localCallVideo" class="call-local-video" autoplay muted playsinline></video>

            <div class="call-incoming-actions" id="callIncomingActions">
              <button type="button" class="call-action reject" id="callRejectBtn">
                <i class="ri-close-line"></i>
                <span>Rechazar</span>
              </button>
              <button type="button" class="call-action accept" id="callAcceptBtn">
                <i class="ri-phone-fill"></i>
                <span>Aceptar</span>
              </button>
            </div>
          </div>

          <div class="call-controls" id="callControls">
            <button type="button" class="call-control" id="callMuteBtn" title="Silenciar">
              <i class="ri-mic-line"></i>
            </button>
            <button type="button" class="call-control video-only" id="callCameraBtn" title="Cámara">
              <i class="ri-camera-line"></i>
            </button>
            <button type="button" class="call-control hangup" id="callHangupBtn" title="Colgar">
              <i class="ri-phone-fill"></i>
            </button>
          </div>
        </div>
      `;

      document.body.appendChild(panel);

      panel.querySelector("#callAcceptBtn").addEventListener("click", aceptarLlamada);
      panel.querySelector("#callRejectBtn").addEventListener("click", rechazarLlamada);
      panel.querySelector("#callHangupBtn").addEventListener("click", () => finalizarLlamadaLocal("Llamada finalizada"));
      panel.querySelector("#callMuteBtn").addEventListener("click", alternarMute);
      panel.querySelector("#callCameraBtn").addEventListener("click", alternarCamara);
      panel.querySelector("#callMinimize").addEventListener("click", () => panel.classList.toggle("minimized"));

      return panel;
    }

    function mostrarPanelLlamada(mode) {
      const panel = asegurarPanelLlamada();
      const videoCall = llamada.tipo === "video";
      const incoming = mode === "incoming";

      panel.classList.remove("hidden", "minimized");
      panel.classList.toggle("audio-call", !videoCall);
      panel.classList.toggle("video-call", videoCall);
      panel.classList.toggle("incoming", incoming);

      panel.querySelector("#callName").textContent = llamada.nombre || "Usuario";
      panel.querySelector("#callTypeLabel").textContent =
        incoming
          ? (videoCall ? "Videollamada entrante" : "Llamada entrante")
          : (videoCall ? "Videollamada" : "Llamada de voz");

      panel.querySelector("#callIncomingActions").style.display = incoming ? "flex" : "none";
      panel.querySelector("#callControls").style.display = incoming ? "none" : "flex";
      panel.querySelector("#callCameraBtn").style.display = videoCall ? "grid" : "none";
      panel.querySelector("#remoteCallVideo").style.display = videoCall ? "block" : "none";
      panel.querySelector("#localCallVideo").style.display = videoCall ? "block" : "none";

      const avatarWrap = panel.querySelector("#callAvatarWrap");
      avatarWrap.innerHTML = llamada.avatarTipo === "video"
        ? `<video src="${escHtml(llamada.avatar)}" autoplay muted loop playsinline></video>`
        : `<img src="${escHtml(llamada.avatar || "https://api.dicebear.com/7.x/thumbs/svg?seed=default")}" alt="">`;

      actualizarEstadoLlamada(incoming ? "Llamada entrante" : "Llamando…");
    }

    function actualizarEstadoLlamada(texto) {
      document.getElementById("callStatus")?.replaceChildren(document.createTextNode(texto));
    }

    async function iniciarLlamada(tipo) {
      if (!destinatarioId || llamada.activa) return;

      const info = usuariosLlamada.get(String(destinatarioId)) || {};
      const callId = `${yo._id}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;

      llamada = {
        activa: true,
        callId,
        tipo: tipo === "video" ? "video" : "audio",
        role: "caller",
        peerId: String(destinatarioId),
        nombre: info.nombre || "Usuario",
        avatar: info.avatar || "",
        avatarTipo: info.avatarTipo || "imagen",
        peer: null,
        localStream: null,
        remoteStream: null,
        pendingCandidates: []
      };

      mostrarPanelLlamada("outgoing");

      try {
        await prepararPeer(false, true);

        socket.emit("llamada:invitar", {
          destinatarioId: String(destinatarioId),
          callId,
          tipo: llamada.tipo,
          callerName: yo.nombre,
          callerAvatar: yo.avatar,
          callerAvatarTipo: yo.avatarTipo || "imagen"
        });
      } catch (error) {
        console.error("Media:", error);
        finalizarLlamadaLocal("No se pudo acceder al micrófono o cámara.");
      }
    }

    async function aceptarLlamada() {
      if (!llamada.activa || llamada.role !== "receiver") return;

      try {
        await prepararPeer(false);
        mostrarPanelLlamada("active");
        actualizarEstadoLlamada("Conectando…");

        socket.emit("llamada:aceptar", {
          callerId: llamada.peerId,
          callId: llamada.callId
        });
      } catch (error) {
        console.error("Aceptar llamada:", error);
        socket.emit("llamada:rechazar", {
          callerId: llamada.peerId,
          callId: llamada.callId
        });
        finalizarLlamadaLocal("No se pudo acceder al micrófono o cámara.");
      }
    }

    function rechazarLlamada() {
      if (!llamada.activa) return;

      socket.emit("llamada:rechazar", {
        callerId: llamada.peerId,
        callId: llamada.callId
      });

      finalizarLlamadaLocal("Llamada rechazada", false);
    }

    async function prepararPeer(forceCreate = false, getMedia = false) {
      if (!llamada.peer || forceCreate) {
        if (llamada.peer) llamada.peer.close();

        llamada.peer = new RTCPeerConnection({ iceServers: ICE_SERVERS });

        llamada.peer.onicecandidate = (event) => {
          if (!event.candidate || !llamada.peerId) return;

          socket.emit("llamada:signal", {
            destinatarioId: llamada.peerId,
            callId: llamada.callId,
            signal: {
              type: "candidate",
              candidate: event.candidate.toJSON()
            }
          });
        };

        llamada.peer.ontrack = (event) => {
          if (!llamada.remoteStream) {
            llamada.remoteStream = new MediaStream();
          }

          const exists = llamada.remoteStream
            .getTracks()
            .some(track => track.id === event.track.id);

          if (!exists) llamada.remoteStream.addTrack(event.track);

          const remote = document.getElementById("remoteCallVideo");
          if (remote && remote.srcObject !== llamada.remoteStream) {
            remote.srcObject = llamada.remoteStream;
            remote.play().catch(() => {});
          }

          actualizarEstadoLlamada("Conectado");
        };

        llamada.peer.onconnectionstatechange = () => {
          const state = llamada.peer?.connectionState;

          if (state === "connected") {
            actualizarEstadoLlamada("Conectado");
          } else if (["failed", "disconnected", "closed"].includes(state)) {
            if (state !== "closed") finalizarLlamadaLocal("Se perdió la conexión.");
          }
        };
      }

      if (!llamada.localStream && (getMedia || llamada.role === "receiver")) {
        llamada.localStream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: llamada.tipo === "video"
        });

        llamada.localStream.getTracks().forEach(track => {
          llamada.peer.addTrack(track, llamada.localStream);
        });

        const local = document.getElementById("localCallVideo");
        if (local) {
          local.srcObject = llamada.localStream;
          local.play().catch(() => {});
        }
      }

      if (llamada.tipo === "video") {
        document.getElementById("localCallVideo")?.classList.add("visible");
      }
    }

    async function procesarCandidatosPendientes() {
      if (!llamada.peer?.remoteDescription) return;

      const pendientes = llamada.pendingCandidates.splice(0);
      for (const candidate of pendientes) {
        try {
          await llamada.peer.addIceCandidate(candidate);
        } catch (error) {
          console.warn("ICE pendiente:", error);
        }
      }
    }

    function alternarMute() {
      const audio = llamada.localStream?.getAudioTracks()[0];
      if (!audio) return;

      audio.enabled = !audio.enabled;
      const btn = document.getElementById("callMuteBtn");
      if (btn) {
        btn.classList.toggle("off", !audio.enabled);
        btn.innerHTML = `<i class="${audio.enabled ? "ri-mic-line" : "ri-mic-off-line"}"></i>`;
      }
    }

    function alternarCamara() {
      const video = llamada.localStream?.getVideoTracks()[0];
      if (!video) return;

      video.enabled = !video.enabled;
      const btn = document.getElementById("callCameraBtn");
      if (btn) {
        btn.classList.toggle("off", !video.enabled);
        btn.innerHTML = `<i class="${video.enabled ? "ri-camera-line" : "ri-camera-off-line"}"></i>`;
      }
    }

    function finalizarLlamadaLocal(mensaje = "Llamada finalizada", avisar = true) {
      if (!llamada.activa) return;

      const peerId = llamada.peerId;
      const callId = llamada.callId;

      if (avisar && peerId && callId) {
        socket.emit("llamada:finalizar", {
          destinatarioId: peerId,
          callId,
          razon: "finalizada"
        });
      }

      llamada.localStream?.getTracks().forEach(track => track.stop());
      llamada.remoteStream?.getTracks().forEach(track => track.stop());
      llamada.peer?.close();

      const panel = document.getElementById("callOverlay");
      const remote = document.getElementById("remoteCallVideo");
      const local = document.getElementById("localCallVideo");

      if (remote) remote.srcObject = null;
      if (local) local.srcObject = null;

      if (panel) {
        actualizarEstadoLlamada(mensaje);
        panel.classList.add("closing");
        setTimeout(() => {
          panel.classList.remove("closing", "incoming", "video-call", "audio-call", "minimized");
          panel.classList.add("hidden");
        }, 220);
      }

      llamada = {
        activa: false,
        callId: null,
        tipo: null,
        role: null,
        peerId: null,
        nombre: "",
        avatar: "",
        avatarTipo: "imagen",
        peer: null,
        localStream: null,
        remoteStream: null,
        pendingCandidates: []
      };
    }


    /* =========================================================
       CERRAR CHAT EN MÓVIL
    ========================================================== */

    function cerrarChatMobile() {

      document.body.classList.remove("chat-open");

      convActiva = null;
      destinatarioId = null;

      history.replaceState(
        {},
        "",
        "messages.html"
      );

      document
        .querySelectorAll(".conv-item")
        .forEach(el => el.classList.remove("activa"));
    }



    /* =========================================================
       ENVIAR MENSAJE
    ========================================================== */

    async function enviarMensaje() {

      const inp =
        document.getElementById(
          "chatInput"
        );


      const contenido =
        inp?.value.trim();


      if (
        !contenido ||
        !convActiva
      ) return;


      const btn =
        document.getElementById(
          "btnEnviar"
        );


      if (btn) {
        btn.disabled = true;
      }


      inp.value = "";

      inp.style.height =
        "auto";


      try {

        const res =
          await fetch(
            `${API}/messages/${convActiva}/send`,
            {
              method: "POST",

              headers: {
                Authorization:
                  `Bearer ${token}`,

                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  contenido
                })
            }
          );


        const msg =
          await res.json();


        if (!res.ok) {
          throw new Error(
            msg.mensaje
          );
        }


        socket.emit(
          "enviarMensaje",
          {
            convId:
              convActiva,

            mensaje:
              msg,

            destinatarioId
          }
        );


        renderMensaje(msg);

        scrollChat();

        cargarConversaciones();


        socket.emit(
          "dejoDeEscribir",
          {
            convId:
              convActiva,

            destinatarioId
          }
        );

      }

      catch (e) {

        alert(
          "Error: " +
          e.message
        );

      }

      finally {

        if (btn) {
          btn.disabled = false;
        }


        document
          .getElementById(
            "chatInput"
          )
          ?.focus();

      }

    }



    /* =========================================================
       RENDER MENSAJE
    ========================================================== */

    function renderMensaje(msg) {

      const container =
        document.getElementById(
          "chatMessages"
        );


      if (!container) return;


      if (
        document.getElementById(
          `msg-${msg._id}`
        )
      ) return;


      const esMio =
        msg.remitente._id === yo._id ||
        msg.remitente === yo._id;


      const tiempo =
        tiempoRelativo(
          msg.createdAt
        );


      const el =
        document.createElement(
          "div"
        );


      el.className =
        `mensaje ${esMio ? "mio" : "suyo"}`;


      el.id =
        `msg-${msg._id}`;


      el.innerHTML = `

        <div class="mensaje-burbuja">

          <p>
            ${escHtml(msg.contenido)}
          </p>

          <span class="mensaje-tiempo">

            <i class="ri-time-line"></i>

            ${tiempo}

          </span>

        </div>

      `;


      container.appendChild(el);

    }



    /* =========================================================
       SCROLL
    ========================================================== */

    function scrollChat() {

      const c =
        document.getElementById(
          "chatMessages"
        );


      if (c) {

        c.scrollTop =
          c.scrollHeight;

      }

    }



    /* =========================================================
       NUEVA CONVERSACIÓN
    ========================================================== */

    let searchTimer = null;


    document
      .getElementById(
        "btnNuevaConv"
      )
      .addEventListener(
        "click",
        () => {

          const box =
            document.getElementById(
              "searchUserBox"
            );


          box.classList.toggle(
            "hidden"
          );


          if (
            !box.classList.contains(
              "hidden"
            )
          ) {

            document
              .getElementById(
                "searchUserInput"
              )
              .focus();

          }

        }
      );



    document
      .getElementById(
        "searchUserInput"
      )
      .addEventListener(
        "input",
        function() {

          clearTimeout(
            searchTimer
          );


          searchTimer =
            setTimeout(
              () =>
                buscarUsuarios(
                  this.value.trim()
                ),
              400
            );

        }
      );



    /* =========================================================
       BUSCAR USUARIOS
    ========================================================== */

    async function buscarUsuarios(q) {

      const box =
        document.getElementById(
          "searchResults"
        );


      if (q.length < 2) {

        box.innerHTML =
          "";

        return;

      }


      try {

        const res =
          await fetch(
            `${API}/profile/search?q=${encodeURIComponent(q)}`,
            {
              headers: {
                Authorization:
                  `Bearer ${token}`
              }
            }
          );


        const data =
          await res.json();


        if (!data.length) {

          box.innerHTML = `

            <div class="search-empty">

              <div class="search-empty-icon">
                <i class="ri-user-search-line"></i>
              </div>

              <span>
                Sin resultados
              </span>

            </div>

          `;

          return;

        }



        box.innerHTML =
          data.map(u => {

            const avHTML =
              u.avatarTipo === "video"

                ? `
                  <video
                    src="${u.avatar}"
                    autoplay
                    loop
                    muted
                    playsinline
                    class="avatar-sm"
                  ></video>
                `

                : `
                  <img
                    src="${u.avatar}"
                    class="avatar-sm"
                    alt=""
                  >
                `;


            return `

              <div
                class="search-result-item"
                onclick="iniciarChatConUsuario('${u._id}')"
              >

                ${avHTML}


                <div class="search-result-info">

                  <strong>
                    ${escHtml(u.nombre)}
                  </strong>

                  <small>
                    @${escHtml(u.handle)}
                  </small>

                </div>


                <span class="search-result-arrow">

                  <i class="ri-arrow-right-s-line"></i>

                </span>

              </div>

            `;

          }).join("");

      }

      catch (e) {}

    }



    /* =========================================================
       INICIAR CHAT
    ========================================================== */

    async function iniciarChatConUsuario(userId) {

      document
        .getElementById(
          "searchUserBox"
        )
        .classList.add(
          "hidden"
        );


      document
        .getElementById(
          "searchUserInput"
        )
        .value =
          "";


      document
        .getElementById(
          "searchResults"
        )
        .innerHTML =
          "";


      try {

        const res =
          await fetch(
            `${API}/messages`,
            {
              method: "POST",

              headers: {
                Authorization:
                  `Bearer ${token}`,

                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  usuarioId:
                    userId
                })
            }
          );


        const conv =
          await res.json();


        if (!res.ok) {

          throw new Error(
            conv.mensaje
          );

        }


        await cargarConversaciones();


        const otro =
          conv.participantes.find(
            p => p._id !== yo._id
          );


        if (otro) {

          abrirConv(
            conv._id,
            otro._id,
            otro.nombre,
            otro.avatar,
            otro.avatarTipo || "imagen",
            otro.handle
          );

        }

      }

      catch (e) {

        alert(
          e.message
        );

      }

    }



    /* =========================================================
       UTILS
    ========================================================== */

    function escHtml(str = "") {

      return String(str)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        );

    }



    function tiempoRelativo(fecha) {

      const d =
        (Date.now() -
          new Date(fecha))
        / 1000;


      if (d < 60) {
        return "ahora";
      }


      if (d < 3600) {

        return `${Math.floor(d / 60)}m`;

      }


      if (d < 86400) {

        return `${Math.floor(d / 3600)}h`;

      }


      return new Date(fecha)
        .toLocaleDateString(
          "es",
          {
            day: "numeric",
            month: "short"
          }
        );

    }



    /* =========================================================
       INIT
    ========================================================== */

    cargarConversaciones();



    /* =========================================================
       ABRIR CONVERSACIÓN DESDE URL
    ========================================================== */

    const convParam =
      new URLSearchParams(
        location.search
      ).get("conv");


    if (convParam) {

      setTimeout(
        async () => {

          try {

            const res =
              await fetch(
                `${API}/messages`,
                {
                  headers: {
                    Authorization:
                      `Bearer ${token}`
                  }
                }
              );


            const convs =
              await res.json();


            const conv =
              convs.find(
                c =>
                  c._id ===
                  convParam
              );


            if (conv) {

              const otro =
                conv.participantes.find(
                  p =>
                    p._id !== yo._id
                );


              if (otro) {

                abrirConv(
                  conv._id,
                  otro._id,
                  otro.nombre,
                  otro.avatar,
                  otro.avatarTipo ||
                    "imagen",
                  otro.handle
                );

              }

            }

          }

          catch (e) {}

        },
        600
      );

    }

  </script>

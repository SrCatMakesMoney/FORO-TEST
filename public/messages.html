  <!-- =========================================================
       ORIGINAL JAVASCRIPT
       LÓGICA DEL CHAT CONSERVADA
  ========================================================== -->

  <script>

    const API = "/api";

    const token =
      localStorage.getItem("fu_token");

    const yo =
      JSON.parse(
        localStorage.getItem("fu_usuario") || "null"
      );


    if (!token || !yo) {
      window.location.href = "/login.html";
    }



    /* =========================================================
       NAV
    ========================================================== */

    document.getElementById("navPerfil").href =
      `profile.html?handle=${yo.handle}`;

    document.getElementById("bnPerfil").href =
      `profile.html?handle=${yo.handle}`;



    /* =========================================================
       SIDEBAR USER
    ========================================================== */

    const avatarSidebarHTML =
      yo.avatarTipo === "video"

        ? `
          <video
            src="${yo.avatar}"
            autoplay
            loop
            muted
            playsinline
            class="sidebar-avatar"
          ></video>
        `

        : `
          <img
            src="${yo.avatar}"
            class="sidebar-avatar"
            alt=""
          >
        `;


    document.getElementById("sidebarUser").innerHTML = `

      ${avatarSidebarHTML}

      <div class="sidebar-user-info">

        <strong>
          ${escHtml(yo.nombre)}
        </strong>

        <small>
          @${escHtml(yo.handle)}
        </small>

      </div>

      <i class="ri-more-2-fill sidebar-user-more"></i>

    `;



    /* =========================================================
       ESTADO
    ========================================================== */

    let convActiva = null;

    let destinatarioId = null;

    let escribiendoTimer = null;

    // =========================================================
    // LLAMADAS / WEBRTC
    // =========================================================
    const usuariosLlamada = new Map();
    const ICE_SERVERS = [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" }
    ];

    let llamada = {
      activa: false,
      callId: null,
      tipo: null,
      role: null,
      peerId: null,
      nombre: "",
      avatar: "",
      avatarTipo: "imagen",
      peer: null,
      localStream: null,
      remoteStream: null,
      pendingCandidates: [],
      timeout: null,
      startedAt: null,
      connectedAt: null
    };



    /* =========================================================
       SOCKET.IO
    ========================================================== */

    const socket = window.foroRealtime;


    socket.on(
      "nuevoMensaje",
      ({ convId, mensaje }) => {

        if (convActiva === convId) {

          renderMensaje(mensaje);

          scrollChat();

        } else {

          const item =
            document.querySelector(
              `[data-conv="${convId}"]`
            );


          if (item) {

            let badge =
              item.querySelector(
                ".badge-noLeidos"
              );


            if (!badge) {

              badge =
                document.createElement("span");

              badge.className =
                "badge-noLeidos";

              item.appendChild(badge);

            }


            badge.textContent =
              parseInt(
                badge.textContent || "0"
              ) + 1;

          }

        }


        cargarConversaciones();

      }
    );



    socket.on(
      "usuarioEscribiendo",
      ({ convId, nombre }) => {

        if (convActiva === convId) {

          const el =
            document.getElementById(
              "escribiendoIndicador"
            );


          if (el) {

            el.innerHTML = `

              <span class="typing-dots">
                <i></i>
                <i></i>
                <i></i>
              </span>

              ${escHtml(nombre)}
              está escribiendo...

            `;

          }

        }

      }
    );



    socket.on(
      "usuarioDejoEscribir",
      ({ convId }) => {

        if (convActiva === convId) {

          const el =
            document.getElementById(
              "escribiendoIndicador"
            );


          if (el) {
            el.innerHTML = "";
          }

        }

      }
    );


    // =========================================================
    // EVENTOS DE LLAMADA / SEÑALIZACIÓN WEBRTC
    // =========================================================

    socket.on("llamada:entrante", (data) => {
      if (!data?.callId || !data?.callerId) return;

      if (llamada.activa) {
        socket.emit("llamada:rechazada", {
          destinatarioId: String(data.callerId),
          callId: String(data.callId),
          razon: "ocupado"
        });
        return;
      }

      const info = usuariosLlamada.get(String(data.callerId)) || {};
      llamada = {
        ...llamada,
        activa: true,
        callId: String(data.callId),
        tipo: data.tipo === "video" ? "video" : "audio",
        role: "receiver",
        peerId: String(data.callerId),
        nombre: data.callerName || info.nombre || "Usuario",
        avatar: data.callerAvatar || info.avatar || "",
        avatarTipo: data.callerAvatarTipo || info.avatarTipo || "imagen",
        convId: data.convId || null,
        peer: null,
        localStream: null,
        remoteStream: null,
        pendingCandidates: [],
        remoteDescriptionSet: false,
        startedAt: null,
        connectedAt: null,
        timeout: setTimeout(() => {
          if (llamada.activa && llamada.role === "receiver") {
            finalizarLlamadaLocal("La llamada expiró.", true);
          }
        }, 45000)
      };

      insertarEventoLlamada("incoming", data.convId || convActiva, data.callId, data.tipo, data.callerName || "Usuario");
      mostrarPanelLlamada("incoming");
    });

    socket.on("llamada:aceptada", async ({ callId, receiverId }) => {
      if (!llamada.activa || llamada.callId !== String(callId) || llamada.role !== "caller") return;

      try {
        clearTimeout(llamada.timeout);
        actualizarEstadoLlamada("Conectando…");
        actualizarEventoLlamada(callId, "conectando");

        // El caller obtiene sus dispositivos después de que el receptor
        // aceptó. Esto evita pedir permisos al abrir la llamada.
        await prepararPeer(false, true);

        const offer = await llamada.peer.createOffer();
        await llamada.peer.setLocalDescription(offer);

        const result = await socket.emit("llamada:signal", {
          destinatarioId: String(receiverId || llamada.peerId),
          callId: llamada.callId,
          signal: {
            type: "description",
            description: llamada.peer.localDescription
          }
        });

        if (result?.ok === false) throw new Error(result.mensaje || "No se pudo enviar la oferta.");
      } catch (error) {
        console.error("Llamada aceptada:", error);
        finalizarLlamadaLocal(mediaErrorMessage(error), true);
      }
    });

    socket.on("llamada:rechazada", ({ callId, razon }) => {
      if (!llamada.activa || llamada.callId !== String(callId)) return;
      actualizarEventoLlamada(callId, "rechazada");
      finalizarLlamadaLocal(razon === "ocupado" ? "El usuario está ocupado." : "Llamada rechazada", false);
    });

    socket.on("llamada:finalizada", ({ callId, razon }) => {
      if (!llamada.activa || llamada.callId !== String(callId)) return;
      actualizarEventoLlamada(callId, "finalizada");
      finalizarLlamadaLocal(razon === "rechazada" ? "Llamada rechazada" : "Llamada finalizada", false);
    });

    socket.on("llamada:signal", async ({ callId, signal }) => {
      if (!llamada.activa || llamada.callId !== String(callId) || !signal) return;

      try {
        if (signal.type === "description" && signal.description) {
          await prepararPeer(false, false);
          const description = signal.description;

          if (description.type === "offer") {
            await llamada.peer.setRemoteDescription(description);
            llamada.remoteDescriptionSet = true;
            await procesarCandidatosPendientes();

            // WebRTC genera la respuesta apropiada para el offer recibido.
            const answer = await llamada.peer.createAnswer();
            await llamada.peer.setLocalDescription(answer);

            const result = await socket.emit("llamada:signal", {
              destinatarioId: llamada.peerId,
              callId: llamada.callId,
              signal: {
                type: "description",
                description: llamada.peer.localDescription
              }
            });
            if (result?.ok === false) throw new Error(result.mensaje || "No se pudo enviar la respuesta.");
            actualizarEstadoLlamada("Conectando…");
            return;
          }

          if (description.type === "answer") {
            if (llamada.peer.signalingState !== "have-local-offer") return;
            await llamada.peer.setRemoteDescription(description);
            llamada.remoteDescriptionSet = true;
            await procesarCandidatosPendientes();
            actualizarEstadoLlamada("Conectando…");
            return;
          }
        }

        if (signal.type === "candidate" && signal.candidate) {
          const candidate = new RTCIceCandidate(signal.candidate);
          if (!llamada.peer || !llamada.remoteDescriptionSet) {
            llamada.pendingCandidates.push(candidate);
            return;
          }
          await llamada.peer.addIceCandidate(candidate);
        }
      } catch (error) {
        console.error("WebRTC signal:", error);
        finalizarLlamadaLocal("No se pudo establecer la conexión.", true);
      }
    });

    /* =========================================================
       CARGAR CONVERSACIONES
    ========================================================== */

    async function cargarConversaciones() {

      try {

        const res =
          await fetch(
            `${API}/messages`,
            {
              headers: {
                Authorization:
                  `Bearer ${token}`
              }
            }
          );


        const data =
          await res.json();


        renderConvList(data);

      }

      catch (e) {

        console.error(e);

      }

    }



    /* =========================================================
       RENDER CONVERSACIONES
    ========================================================== */

    function renderConvList(convs) {

      const list =
        document.getElementById(
          "convList"
        );


      if (!convs || convs.length === 0) {

        list.innerHTML = `

          <div class="no-conversations">

            <div class="no-conversations-icon">
              <i class="ri-message-3-line"></i>
            </div>

            <strong>
              Sin conversaciones
            </strong>

            <span>
              Empieza una nueva conversación.
            </span>

            <button
              onclick="document.getElementById('btnNuevaConv').click()"
            >
              <i class="ri-edit-2-line"></i>
              Nueva conversación
            </button>

          </div>

        `;

        return;

      }



      list.innerHTML =
        convs.map(c => {

          const otro =
            c.participantes.find(
              p => p._id !== yo._id
            );


          if (!otro) return "";

          usuariosLlamada.set(String(otro._id), {
            nombre: otro.nombre || "Usuario",
            avatar: otro.avatar || "",
            avatarTipo: otro.avatarTipo || "imagen",
            handle: otro.handle || ""
          });

          const ult =
            c.ultimoMensaje;


          const texto =
            ult

              ? (
                  ult.remitente?._id === yo._id
                    ? "Tú: "
                    : ""
                )

                +

                ult.contenido.substring(
                  0,
                  38
                )

                +

                (
                  ult.contenido.length > 38
                    ? "..."
                    : ""
                )

              : "Iniciar conversación";


          const activo =
            convActiva === c._id
              ? "activa"
              : "";


          const badge =
            c.noLeidos > 0

              ? `
                <span class="badge-noLeidos">
                  ${c.noLeidos}
                </span>
              `

              : "";


          const avatarHTML =
            otro.avatarTipo === "video"

              ? `
                <video
                  src="${otro.avatar}"
                  autoplay
                  loop
                  muted
                  playsinline
                  class="avatar"
                ></video>
              `

              : `
                <img
                  src="${otro.avatar}"
                  class="avatar"
                  alt=""
                >
              `;


          return `

            <div
              class="conv-item ${activo}"
              data-conv="${c._id}"
              onclick="abrirConv(
                '${c._id}',
                '${otro._id}',
                '${escHtml(otro.nombre)}',
                '${otro.avatar}',
                '${otro.avatarTipo || "imagen"}',
                '${escHtml(otro.handle)}'
              )"
            >

              <div class="conv-avatar-wrap">

                ${avatarHTML}

                ${
                  c.noLeidos > 0
                    ? `<span class="online-dot"></span>`
                    : ""
                }

              </div>


              <div class="conv-info">

                <div class="conv-name-row">

                  <strong>
                    ${escHtml(otro.nombre)}
                  </strong>

                </div>


                <small>
                  @${escHtml(otro.handle)}
                </small>


                <p class="conv-ultimo">
                  ${escHtml(texto)}
                </p>

              </div>


              ${badge}

            </div>

          `;

        }).join("");


      if (convActiva) {

        document
          .querySelector(
            `[data-conv="${convActiva}"]`
          )
          ?.classList.add("activa");

      }

    }



    /* =========================================================
       ABRIR CONVERSACIÓN
    ========================================================== */

    async function abrirConv(
      convId,
      otroId,
      otroNombre,
      otroAvatar,
      otroTipo,
      otroHandle
    ) {

      convActiva =
        convId;

      destinatarioId =
        otroId;

      // En móvil, mostrar el panel del chat a pantalla completa.
      document.body.classList.add("chat-open");


      document
        .querySelectorAll(".conv-item")
        .forEach(
          el =>
            el.classList.remove("activa")
        );


      const item =
        document.querySelector(
          `[data-conv="${convId}"]`
        );


      if (item) {

        item.classList.add(
          "activa"
        );

        item
          .querySelector(
            ".badge-noLeidos"
          )
          ?.remove();

      }



      const avatarHTML =
        otroTipo === "video"

          ? `
            <video
              src="${otroAvatar}"
              autoplay
              loop
              muted
              playsinline
              class="avatar chat-avatar"
            ></video>
          `

          : `
            <img
              src="${otroAvatar}"
              class="avatar chat-avatar"
              alt=""
            >
          `;



      document.getElementById(
        "chatPanel"
      ).innerHTML = `

        <div class="chat-header">

          <button
            class="chat-back"
            type="button"
            aria-label="Volver a conversaciones"
            onclick="cerrarChatMobile()"
          >
            <i class="ri-arrow-left-line"></i>
          </button>

          <div class="chat-person">

            ${avatarHTML}

            <div>

              <strong>
                ${escHtml(otroNombre)}
              </strong>

              <a
                href="profile.html?handle=${escHtml(otroHandle)}"
              >
                <i class="ri-user-3-line"></i>
                Ver perfil
              </a>

            </div>

          </div>


          <div class="chat-call-actions">

            <button
              class="chat-call-btn"
              type="button"
              title="Llamada de voz"
              aria-label="Llamada de voz"
              onclick="iniciarLlamada('audio')"
            >
              <i class="ri-phone-line"></i>
            </button>

            <button
              class="chat-call-btn"
              type="button"
              title="Videollamada"
              aria-label="Videollamada"
              onclick="iniciarLlamada('video')"
            >
              <i class="ri-video-add-line"></i>
            </button>

          </div>

          <button
            class="chat-more"
            type="button"
            aria-label="Opciones"
          >
            <i class="ri-more-2-fill"></i>
          </button>

        </div>


        <div
          class="chat-messages"
          id="chatMessages"
        ></div>


        <div
          class="chat-typing"
          id="escribiendoIndicador"
        ></div>


        <div class="chat-input-area">

          <textarea
            id="chatInput"
            placeholder="Escribe un mensaje..."
            maxlength="1000"
            rows="1"
          ></textarea>


          <button
            id="btnEnviar"
            onclick="enviarMensaje()"
            title="Enviar"
            aria-label="Enviar mensaje"
          >

            <i class="ri-send-plane-fill"></i>

          </button>

        </div>

      `;



      /* INPUT */

      const inp =
        document.getElementById(
          "chatInput"
        );


      inp.addEventListener(
        "keydown",
        e => {

          if (
            e.key === "Enter" &&
            !e.shiftKey
          ) {

            e.preventDefault();

            enviarMensaje();

          }

        }
      );


      inp.addEventListener(
        "input",
        () => {

          inp.style.height =
            "auto";

          inp.style.height =
            Math.min(
              inp.scrollHeight,
              120
            ) + "px";


          socket.emit(
            "escribiendo",
            {
              convId,
              nombre: yo.nombre,
              destinatarioId
            }
          );


          clearTimeout(
            escribiendoTimer
          );


          escribiendoTimer =
            setTimeout(
              () => {

                socket.emit(
                  "dejoDeEscribir",
                  {
                    convId,
                    destinatarioId
                  }
                );

              },
              1500
            );

        }
      );


      inp.focus();



      /* MENSAJES */

      try {

        const res =
          await fetch(
            `${API}/messages/${convId}`,
            {
              headers: {
                Authorization:
                  `Bearer ${token}`
              }
            }

        const msgs =

      history.replaceState(

        "",
        `?conv=${convId}`
      );

    function mostrarPanelLlamada(mode) {
      const panel = asegurarPanelLlamada();
      const videoCall = llamada.tipo === "video";
      const incoming = mode === "incoming";

      panel.classList.remove("hidden", "minimized");

      panel.querySelector("#callTypeLabel").textContent =

          : (videoCall ? "Videollamada" : "Llamada de voz");

      panel.querySelector("#callIncomingActions").style.display = incoming ? "flex" : "none";
      panel.querySelector("#callControls").style.display = incoming ? "none" : "flex";
      panel.querySelector("#callCameraBtn").style.display = videoCall ? "grid" : "none";
      panel.querySelector("#remoteCallVideo").style.display = videoCall ? "block" : "none";
      panel.querySelector("#localCallVideo").style.display = videoCall ? "block" : "none";
      panel.querySelector("#remoteCallVideo").classList.remove("has-stream");
      panel.querySelector("#localCallVideo").classList.remove("has-stream");
      panel.querySelector("#callRemotePlaceholder").classList.remove("has-remote-video");

      avatarWrap.innerHTML = llamada.avatarTipo === "video"
        ? `<video src="${escHtml(llamada.avatar)}" autoplay muted loop playsinline></video>`
        : `<img src="${escHtml(llamada.avatar || "https://api.dicebear.com/7.x/thumbs/svg?seed=default")}" alt="">`;

    }

    function actualizarEstadoLlamada(texto) {
      document.getElementById("callStatus")?.replaceChildren(document.createTextNode(texto));
    }

    async function iniciarLlamada(tipo) {
      if (!destinatarioId || llamada.activa) return;

      const info = usuariosLlamada.get(String(destinatarioId)) || {};
      const callId = `${yo._id}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;

      llamada = {
        activa: true,
        callId,
        tipo: tipo === "video" ? "video" : "audio",
        role: "caller",
        convId: convActiva,
        peerId: String(destinatarioId),
        nombre: info.nombre || "Usuario",
        avatar: info.avatar || "",
        avatarTipo: info.avatarTipo || "imagen",
        peer: null,
        localStream: null,
        remoteStream: null,
        pendingCandidates: [],
        remoteDescriptionSet: false,
        timeout: null,
        startedAt: Date.now(),
        connectedAt: null
      };

      mostrarPanelLlamada("outgoing");
      insertarEventoLlamada("outgoing", convActiva, callId, llamada.tipo, llamada.nombre);
      actualizarEstadoLlamada("Llamando…");

      // NO pedimos cámara/micrófono todavía. Primero enviamos la
      // invitación. Esto evita que una falta de permisos en el iPhone
      // o tablet mate la llamada antes de que llegue al otro usuario.
      if (!socket.connected) {
        actualizarEstadoLlamada("Conectando con Foro Ubre…");
        await esperarSocket(5000);
      }

      if (!socket.connected) {
        finalizarLlamadaLocal("No hay conexión con el servidor.", false);
        return;
      }

      socket.emit("llamada:invitar", {
        destinatarioId: String(destinatarioId),
        callId,
        tipo: llamada.tipo,
        callerName: yo.nombre,
        callerAvatar: yo.avatar,
        callerAvatarTipo: yo.avatarTipo || "imagen",
        convId: convActiva
      }, (respuesta) => {
        if (respuesta?.ok === false && llamada.activa && llamada.callId === callId) {
          finalizarLlamadaLocal(respuesta.mensaje || "El usuario no está disponible.", false);
        }
      });

      // Si el receptor nunca responde, no dejamos una llamada colgada.
      clearTimeout(llamada.timeout);
      llamada.timeout = setTimeout(() => {
        if (llamada.activa && llamada.callId === callId && llamada.role === "caller") {
          finalizarLlamadaLocal("No respondió.", true);
        }
      }, 30000);
    }

    async function esperarSocket(timeout = 8000) {
      if (socket.connected) return true;
      if (typeof socket.waitUntilReady === "function") {
        return socket.waitUntilReady(timeout);
      }
      return false;
    }

    function mediaErrorMessage(error) {
      const name = error?.name || "";
      if (name === "NotAllowedError" || name === "PermissionDeniedError") {
        return "Permiso de micrófono/cámara bloqueado. Actívalo en los ajustes del navegador.";
      }
      if (name === "NotFoundError" || name === "DevicesNotFoundError") {
        return "No se encontró un micrófono o cámara disponible.";
      }
      if (name === "NotReadableError" || name === "TrackStartError") {
        return "El micrófono o cámara está siendo usado por otra aplicación.";
      }
      if (name === "SecurityError") {
        return "El navegador bloqueó el acceso al micrófono/cámara por seguridad.";
      }
      return "No se pudo acceder al micrófono o cámara.";
    }

    async function aceptarLlamada() {
      if (!llamada.activa || llamada.role !== "receiver") return;

      const peerId = llamada.peerId;
      const callId = llamada.callId;
      clearTimeout(llamada.timeout);

      try {
        mostrarPanelLlamada("active");
        actualizarEstadoLlamada("Solicitando micrófono/cámara…");

        // El clic de Aceptar es una acción del usuario, ideal para que
        // Safari/iOS/Android permitan getUserMedia().
        await prepararPeer(false, true);

        actualizarEstadoLlamada("Conectando…");
        actualizarEventoLlamada(callId, "conectando");

        socket.emit("llamada:aceptada", {
          destinatarioId: peerId,
          callId
        });
      } catch (error) {
        console.error("Aceptar llamada:", error);
        socket.emit("llamada:rechazada", {
          destinatarioId: peerId,
          callId,
          razon: "rechazada"
        });
        finalizarLlamadaLocal(mediaErrorMessage(error), false);
      }
    }

    function rechazarLlamada() {
      if (!llamada.activa) return;

      socket.emit("llamada:rechazada", {
        destinatarioId: llamada.peerId,
        callId: llamada.callId,
        razon: "rechazada"
      });

      finalizarLlamadaLocal("Llamada rechazada", false);
    }

    async function prepararPeer(forceCreate = false, getMedia = false) {
      if (!llamada.peer || forceCreate) {
        if (llamada.peer) llamada.peer.close();

        llamada.peer = new RTCPeerConnection({ iceServers: ICE_SERVERS });

        llamada.peer.onicecandidate = (event) => {
          if (!event.candidate || !llamada.peerId) return;

          socket.emit("llamada:signal", {
            destinatarioId: llamada.peerId,
            callId: llamada.callId,
            signal: {
              type: "candidate",
              candidate: event.candidate.toJSON()
            }
          });
        };

        llamada.peer.ontrack = (event) => {
          if (!llamada.remoteStream) llamada.remoteStream = new MediaStream();

          if (!llamada.remoteStream.getTracks().some(track => track.id === event.track.id)) {
            llamada.remoteStream.addTrack(event.track);
          }

          const remote = document.getElementById("remoteCallVideo");
          const placeholder = document.getElementById("callRemotePlaceholder");
          if (remote) {
            remote.autoplay = true;
            remote.playsInline = true;
            remote.srcObject = llamada.remoteStream;
            remote.classList.add("has-stream");
            remote.play().catch(() => {
              // Algunos navegadores móviles requieren un gesto; el botón de cámara/overlay
              // vuelve a intentar play cuando el usuario interactúa.
            });
          }
          if (placeholder && llamada.tipo === "video") placeholder.classList.add("has-remote-video");

          actualizarEstadoLlamada("Conectado");
          llamada.connectedAt ||= Date.now();
          actualizarEventoLlamada(llamada.callId, "conectada");
        };

        llamada.peer.onconnectionstatechange = () => {
          const state = llamada.peer?.connectionState;

          if (state === "connected") {
            llamada.connectedAt ||= Date.now();
            actualizarEstadoLlamada("Conectado");
            actualizarEventoLlamada(llamada.callId, "conectada");
          } else if (["failed", "disconnected", "closed"].includes(state)) {
            if (state !== "closed") finalizarLlamadaLocal("Se perdió la conexión.");
          }
        };
      }

      if (!llamada.localStream && getMedia) {
        llamada.localStream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: llamada.tipo === "video"
        });

        llamada.localStream.getTracks().forEach(track => {
          llamada.peer.addTrack(track, llamada.localStream);
        });

        const local = document.getElementById("localCallVideo");
        if (local) {
          local.autoplay = true;
          local.muted = true;
          local.playsInline = true;
          local.srcObject = llamada.localStream;
          local.classList.add("has-stream");
          local.play().catch(() => {});
        }
      }

      if (llamada.tipo === "video") {
        document.getElementById("localCallVideo")?.classList.add("visible");
      }
    }

    async function procesarCandidatosPendientes() {
      if (!llamada.peer?.remoteDescription) return;

      const pendientes = llamada.pendingCandidates.splice(0);
      for (const candidate of pendientes) {
        try {
          await llamada.peer.addIceCandidate(candidate);
        } catch (error) {
          console.warn("ICE pendiente:", error);
        }
      }
    }

    function alternarMute() {
      const audio = llamada.localStream?.getAudioTracks()[0];
      if (!audio) return;

      audio.enabled = !audio.enabled;
      const btn = document.getElementById("callMuteBtn");
      if (btn) {
        btn.classList.toggle("off", !audio.enabled);
        btn.innerHTML = `<i class="${audio.enabled ? "ri-mic-line" : "ri-mic-off-line"}"></i>`;
      }
    }

    function alternarCamara() {
      const video = llamada.localStream?.getVideoTracks()[0];
      if (!video) return;

      video.enabled = !video.enabled;
      const btn = document.getElementById("callCameraBtn");
      if (btn) {
        btn.classList.toggle("off", !video.enabled);
        btn.innerHTML = `<i class="${video.enabled ? "ri-camera-line" : "ri-camera-off-line"}"></i>`;
      }
    }

    function finalizarLlamadaLocal(mensaje = "Llamada finalizada", avisar = true) {
      if (!llamada.activa) return;

      const peerId = llamada.peerId;
      const callId = llamada.callId;
      const convId = llamada.convId || convActiva;
      const tipo = llamada.tipo || "audio";
      const duracion = llamada.connectedAt
        ? Math.max(0, Math.round((Date.now() - llamada.connectedAt) / 1000))
        : 0;

      clearTimeout(llamada.timeout);

      // Solo persistimos llamadas que realmente llegaron a conectarse.
      // Invitaciones rechazadas, permisos fallidos o llamadas que expiraron no entran al historial.
      if (convId && callId && llamada.connectedAt) {
        guardarHistorialLlamada({ convId, callId, tipo, duracion }).catch(error => {
          console.warn("No se pudo guardar el historial de llamada:", error);
        });
      }

      if (avisar && peerId && callId) {
        socket.emit("llamada:finalizada", {
          destinatarioId: peerId,
          callId,
          razon: "finalizada"
        });
      }

      llamada.localStream?.getTracks().forEach(track => track.stop());
      llamada.remoteStream?.getTracks().forEach(track => track.stop());
      llamada.peer?.close();

      const panel = document.getElementById("callOverlay");
      const remote = document.getElementById("remoteCallVideo");
      const local = document.getElementById("localCallVideo");

      if (remote) remote.srcObject = null;
      if (local) local.srcObject = null;

      if (panel) {
        actualizarEstadoLlamada(mensaje);
        panel.classList.add("closing");
        setTimeout(() => {
          panel.classList.remove("closing", "incoming", "video-call", "audio-call", "minimized");
          panel.classList.add("hidden");
        }, 220);
      }

      llamada = {
        activa: false,
        callId: null,
        tipo: null,
        role: null,
        peerId: null,
        nombre: "",
        avatar: "",
        avatarTipo: "imagen",
        convId: null,
        peer: null,
        localStream: null,
        remoteStream: null,
        pendingCandidates: [],
        remoteDescriptionSet: false,
        timeout: null,
        startedAt: null,
        connectedAt: null
      };
    }

    async function enviarMensaje() {

      const inp =
        document.getElementById(
          "chatInput"
        );


      const contenido =
        inp?.value.trim();


      if (
        !contenido ||
        !convActiva
      ) return;


      const btn =
        document.getElementById(
          "btnEnviar"
        );


      if (btn) {
        btn.disabled = true;
      }


      inp.value = "";

      inp.style.height =
        "auto";


      try {

        const res =
          await fetch(
            `${API}/messages/${convActiva}/send`,
            {
              method: "POST",

              headers: {
                Authorization:
                  `Bearer ${token}`,

                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  contenido
                })
            }
          );


        const msg =
          await res.json();


        if (!res.ok) {
          throw new Error(
            msg.mensaje
          );
        }



        renderMensaje(msg);

        scrollChat();

        cargarConversaciones();


        socket.emit(
          "dejoDeEscribir",
          {
            convId:
              convActiva,

            destinatarioId
          }
        );

      }

      catch (e) {

        alert(
          "Error: " +
          e.message
        );

      }

      finally {

        if (btn) {
          btn.disabled = false;
        }


        document
          .getElementById(
            "chatInput"
          )
          ?.focus();

      }

    }



    /* =========================================================
       RENDER MENSAJE
    ========================================================== */

    function renderMensaje(msg) {

      const container =
        document.getElementById(
          "chatMessages"
        );


      if (!container) return;

      if (msg.tipo === "llamada") {
        const video = msg.llamadaTipo === "video";
        const estado = msg.llamadaEstado || "finalizada";
        const duracion = Number(msg.llamadaDuracion || 0);
        const minutos = Math.floor(duracion / 60);
        const segundos = String(duracion % 60).padStart(2, "0");
        const el = document.createElement("div");
        el.className = "mensaje-llamada historial-llamada finalizada";
        el.dataset.callId = String(msg.llamadaId || msg._id);
        el.innerHTML = `
          <div class="mensaje-llamada-icon"><i class="${video ? "ri-video-chat-fill" : "ri-phone-fill"}"></i></div>
          <div class="mensaje-llamada-copy">
            <strong>${video ? "Videollamada" : "Llamada de voz"}</strong>
            <span>${estado === "finalizada" ? `Llamada finalizada${duracion ? ` · ${minutos}:${segundos}` : ""}` : escHtml(estado)}</span>
          </div>
          <div class="mensaje-llamada-status"><i class="ri-check-line"></i></div>
        `;
        container.appendChild(el);
        return;
      }


      if (
        document.getElementById(
          `msg-${msg._id}`
        )
      ) return;


      const esMio =
        msg.remitente._id === yo._id ||
        msg.remitente === yo._id;


      const tiempo =
        tiempoRelativo(
          msg.createdAt
        );


      const el =
        document.createElement(
          "div"
        );


      el.className =
        `mensaje ${esMio ? "mio" : "suyo"}`;


      el.id =
        `msg-${msg._id}`;


      el.innerHTML = `

        <div class="mensaje-burbuja">

          <p>
            ${escHtml(msg.contenido)}
          </p>

          <span class="mensaje-tiempo">

            <i class="ri-time-line"></i>

            ${tiempo}

          </span>

        </div>

      `;


      container.appendChild(el);

    }



    async function guardarHistorialLlamada({ convId, callId, tipo, duracion = 0 }) {
      const res = await fetch(`${API}/messages/${encodeURIComponent(convId)}/call-history`, {
        method: "POST",
        headers: {
          Authorization: `Bearer ${token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ callId, tipo, duracion })
      });

      const data = await res.json().catch(() => null);
      if (!res.ok) throw new Error(data?.mensaje || "No se pudo guardar la llamada.");
      if (data?.mensaje) renderMensaje(data.mensaje);
      return data?.mensaje;
    }

    /* =========================================================
       EVENTO DE LLAMADA EN EL CHAT
    ========================================================= */

    function insertarEventoLlamada(modo, convId, callId, tipo = "audio", nombre = "Usuario") {
      if (!convId || !callId) return;
      if (convActiva !== String(convId)) return;

      const container = document.getElementById("chatMessages");
      if (!container) return;

      const id = `call-event-${String(callId).replace(/[^a-zA-Z0-9_-]/g, "")}`;
      if (document.getElementById(id)) return;

      const video = tipo === "video";
      const el = document.createElement("div");
      el.className = "mensaje-llamada";
      el.id = id;
      el.dataset.callId = String(callId);
      el.innerHTML = `
        <div class="mensaje-llamada-icon"><i class="${video ? "ri-video-chat-fill" : "ri-phone-fill"}"></i></div>
        <div class="mensaje-llamada-copy">
          <strong>${modo === "incoming" ? "Llamada entrante" : video ? "Videollamada" : "Llamada de voz"}</strong>
          <span>${modo === "incoming" ? `${escHtml(nombre)} te está llamando` : "Llamando…"}</span>
        </div>
        <div class="mensaje-llamada-status">•</div>
      `;
      container.appendChild(el);
      scrollChat();
    }

    function actualizarEventoLlamada(callId, estado) {
      if (!callId) return;
      const safe = String(callId).replace(/[^a-zA-Z0-9_-]/g, "");
      const el = document.getElementById(`call-event-${safe}`);
      if (!el) return;

      const copy = el.querySelector(".mensaje-llamada-copy span");
      const status = el.querySelector(".mensaje-llamada-status");
      const textos = { conectando: "Conectando…", conectada: "Llamada conectada", rechazada: "Llamada rechazada", finalizada: "Llamada finalizada" };
      if (copy) copy.textContent = textos[estado] || estado;
      if (status) status.textContent = estado === "conectada" ? "✓" : estado === "rechazada" ? "×" : "";
      el.classList.toggle("finalizada", estado === "rechazada" || estado === "finalizada");
    }

    async function buscarUsuarios(q) {

      const box =
        document.getElementById(
          "searchResults"
        );


      if (q.length < 2) {

        box.innerHTML =
          "";

        return;

      }


      try {

        const res =
          await fetch(
            `${API}/profile/search?q=${encodeURIComponent(q)}`,
            {
              headers: {
                Authorization:
                  `Bearer ${token}`
              }
            }
          );


        const data =
          await res.json();


        if (!data.length) {

          box.innerHTML = `

            <div class="search-empty">

              <div class="search-empty-icon">
                <i class="ri-user-search-line"></i>
              </div>

              <span>
                Sin resultados
              </span>

            </div>

          `;

          return;

        }



        box.innerHTML =
          data.map(u => {

            const avHTML =
              u.avatarTipo === "video"

                ? `
                  <video
                    src="${u.avatar}"
                    autoplay
                    loop
                    muted
                    playsinline
                    class="avatar-sm"
                  ></video>
                `

                : `
                  <img
                    src="${u.avatar}"
                    class="avatar-sm"
                    alt=""
                  >
                `;


            return `

              <div
                class="search-result-item"
                onclick="iniciarChatConUsuario('${u._id}')"
              >

                ${avHTML}


                <div class="search-result-info">

                  <strong>
                    ${escHtml(u.nombre)}
                  </strong>

                  <small>
                    @${escHtml(u.handle)}
                  </small>

                </div>


                <span class="search-result-arrow">

                  <i class="ri-arrow-right-s-line"></i>

                </span>

              </div>

            `;

          }).join("");

      }

      catch (e) {}

    }



    /* =========================================================
       INICIAR CHAT
    ========================================================== */

    async function iniciarChatConUsuario(userId) {

      document
        .getElementById(
          "searchUserBox"
        )
        .classList.add(
          "hidden"
        );


      document
        .getElementById(
          "searchUserInput"
        )
        .value =
          "";


      document
        .getElementById(
          "searchResults"
        )
        .innerHTML =
          "";


      try {

        const res =
          await fetch(
            `${API}/messages`,
            {
              method: "POST",

              headers: {
                Authorization:
                  `Bearer ${token}`,

                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  usuarioId:
                    userId
                })
            }
          );


        const conv =
          await res.json();


        if (!res.ok) {

          throw new Error(
            conv.mensaje
          );

        }


        await cargarConversaciones();


        const otro =
          conv.participantes.find(
            p => p._id !== yo._id
          );


        if (otro) {

          abrirConv(
            conv._id,
            otro._id,
            otro.nombre,
            otro.avatar,
            otro.avatarTipo || "imagen",
            otro.handle
          );

        }

      }

      catch (e) {

        alert(
          e.message
        );

      }

    }



    /* =========================================================
       UTILS
    ========================================================== */

    function escHtml(str = "") {

      return String(str)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        );

    }



    function tiempoRelativo(fecha) {

      const d =
        (Date.now() -
          new Date(fecha))
        / 1000;


      if (d < 60) {
        return "ahora";
      }


      if (d < 3600) {

        return `${Math.floor(d / 60)}m`;

      }


      if (d < 86400) {

        return `${Math.floor(d / 3600)}h`;

      }


      return new Date(fecha)
        .toLocaleDateString(
          "es",
          {
            day: "numeric",
            month: "short"
          }
        );

    }



    /* =========================================================
       INIT
    ========================================================== */

    cargarConversaciones();



    /* =========================================================
       ABRIR CONVERSACIÓN DESDE URL
    ========================================================== */

    const convParam =
      new URLSearchParams(
        location.search
      ).get("conv");


    if (convParam) {

      setTimeout(
        async () => {

          try {

            const res =
              await fetch(
                `${API}/messages`,
                {
                  headers: {
                    Authorization:
                      `Bearer ${token}`
                  }
                }
              );


            const convs =
              await res.json();


            const conv =
              convs.find(
                c =>
                  c._id ===
                  convParam
              );


            if (conv) {

              const otro =
                conv.participantes.find(
                  p =>
                    p._id !== yo._id
                );


              if (otro) {

                abrirConv(
                  conv._id,
                  otro._id,
                  otro.nombre,
                  otro.avatar,
                  otro.avatarTipo ||
                    "imagen",
                  otro.handle
                );

              }

            }

          }

          catch (e) {}

        },
        600
      );

    }

  </script>

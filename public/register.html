<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta name="theme-color" content="#050606"/>

    <title>Foro Ubre — Registro</title>

    <link
        href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css"
        rel="stylesheet"
    />

    <link rel="stylesheet" href="auth.css"/>
</head>

<body class="auth-page">

    <main class="auth-container">

        <div class="auth-logo">
            <i class="ri-leaf-fill"></i>
            <span>Foro Ubre</span>
        </div>

        <h2>Crear cuenta</h2>

        <form id="registerForm" novalidate>

            <!-- =================================================
                 AVATAR
                 ================================================= -->

            <div class="avatar-picker">

                <div
                    class="avatar-preview-wrap"
                    id="avatarPreviewWrap"
                    onclick="document.getElementById('avatarInput').click()"
                >

                    <img
                        id="avatarPreviewImg"
                        src=""
                        alt=""
                        class="hidden"
                    />

                    <video
                        id="avatarPreviewVid"
                        autoplay
                        loop
                        muted
                        playsinline
                        class="hidden"
                    ></video>

                    <div
                        id="avatarPlaceholder"
                        class="avatar-placeholder"
                    >
                        <i class="ri-user-3-line"></i>
                    </div>

                </div>

                <label
                    for="avatarInput"
                    class="btn-pick-avatar"
                >

                    <span>
                        <i class="ri-camera-line"></i>
                        Elegir foto de perfil
                    </span>

                    <small>
                        Imagen, GIF o Video · Máx. 3MB
                    </small>

                </label>

                <input
                    type="file"
                    id="avatarInput"
                    name="avatar"
                    accept="
                        image/jpeg,
                        image/png,
                        image/gif,
                        image/webp,
                        video/mp4,
                        video/webm
                    "
                    hidden
                />

                <span
                    id="avatarError"
                    class="error-msg hidden"
                >
                    <i class="ri-error-warning-line"></i>
                    <span id="avatarErrorText"></span>
                </span>

            </div>


            <!-- =================================================
                 NOMBRE
                 ================================================= -->

            <div class="form-group">

                <label>
                    <i class="ri-user-line"></i>
                    Nombre

                    <small>
                        (2–50 caracteres)
                    </small>
                </label>

                <input
                    type="text"
                    id="nombre"
                    placeholder="Tu nombre"
                    required
                    minlength="2"
                    maxlength="50"
                    autocomplete="name"
                />

                <span class="char-hint">
                    <span id="cNombre">50</span>
                    restantes
                </span>

            </div>


            <!-- =================================================
                 HANDLE
                 ================================================= -->

            <div class="form-group">

                <label>
                    <i class="ri-at-line"></i>
                    Handle

                    <small>
                        (3–20 caracteres)
                    </small>
                </label>

                <div class="input-prefix">

                    <span>@</span>

                    <input
                        type="text"
                        id="handle"
                        placeholder="tuhandle"
                        required
                        minlength="3"
                        maxlength="20"
                        pattern="[a-zA-Z0-9_]+"
                        title="Solo letras, números y _"
                        autocomplete="username"
                    />

                </div>

                <span class="char-hint">
                    <span id="cHandle">20</span>
                    restantes
                </span>

            </div>


            <!-- =================================================
                 EMAIL
                 ================================================= -->

            <div class="form-group">

                <label>
                    <i class="ri-mail-line"></i>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="tu@email.com"
                    required
                    maxlength="100"
                    autocomplete="email"
                />

            </div>


            <!-- =================================================
                 PASSWORD
                 ================================================= -->

            <div class="form-group">

                <label>
                    <i class="ri-lock-line"></i>
                    Contraseña

                    <small>
                        (mín. 6 caracteres)
                    </small>
                </label>

                <div class="input-password-wrap">

                    <input
                        type="password"
                        id="password"
                        placeholder="••••••••"
                        required
                        minlength="6"
                        maxlength="128"
                        autocomplete="new-password"
                    />

                    <button
                        type="button"
                        class="btn-toggle-pass"
                        id="btnTogglePass"
                        tabindex="-1"
                        aria-label="Mostrar contraseña"
                    >

                        <i
                            class="ri-eye-line"
                            id="eyeIcon"
                        ></i>

                    </button>

                </div>

            </div>


            <!-- =================================================
                 ERROR
                 ================================================= -->

            <div
                id="errorMsg"
                class="error-msg hidden"
                role="alert"
            >

                <i class="ri-error-warning-line"></i>

                <span id="errorText"></span>

            </div>


            <!-- =================================================
                 REGISTER
                 ================================================= -->

            <button
                type="submit"
                class="btn-auth"
                id="btnRegister"
            >

                <i class="ri-user-add-line"></i>

                <span>Crear cuenta</span>

            </button>

        </form>


        <!-- =====================================================
             LOGIN LINK
             ===================================================== -->

        <p class="auth-switch">

            ¿Ya tienes cuenta?

            <a href="login.html">
                Inicia sesión
            </a>

        </p>

    </main>


    <script>
        /* =====================================================
           AUTH REDIRECT
           ===================================================== */

        if (localStorage.getItem("fu_token")) {
            window.location.href = "/";
        }


        /* =====================================================
           TOGGLE PASSWORD
           ===================================================== */

        document
            .getElementById("btnTogglePass")
            .addEventListener("click", () => {

                const input =
                    document.getElementById("password");

                const icon =
                    document.getElementById("eyeIcon");

                input.type =
                    input.type === "password"
                        ? "text"
                        : "password";

                icon.className =
                    input.type === "password"
                        ? "ri-eye-line"
                        : "ri-eye-off-line";
            });


        /* =====================================================
           CHARACTER COUNTERS
           ===================================================== */

        document
            .getElementById("nombre")
            .addEventListener("input", function () {

                document
                    .getElementById("cNombre")
                    .textContent =
                    50 - this.value.length;
            });


        document
            .getElementById("handle")
            .addEventListener("input", function () {

                this.value =
                    this.value.replace(
                        /[^a-zA-Z0-9_]/g,
                        ""
                    );

                document
                    .getElementById("cHandle")
                    .textContent =
                    20 - this.value.length;
            });


        /* =====================================================
           AVATAR PREVIEW
           ===================================================== */

        document
            .getElementById("avatarInput")
            .addEventListener("change", function () {

                const file = this.files[0];

                const errorBox =
                    document.getElementById(
                        "avatarError"
                    );

                const errorText =
                    document.getElementById(
                        "avatarErrorText"
                    );

                const img =
                    document.getElementById(
                        "avatarPreviewImg"
                    );

                const video =
                    document.getElementById(
                        "avatarPreviewVid"
                    );

                const placeholder =
                    document.getElementById(
                        "avatarPlaceholder"
                    );

                errorBox.classList.add("hidden");

                if (!file) {
                    return;
                }


                /* 3MB */

                if (file.size > 3 * 1024 * 1024) {

                    errorText.textContent =
                        "El archivo supera los 3MB";

                    errorBox.classList.remove(
                        "hidden"
                    );

                    this.value = "";

                    return;
                }


                const url =
                    URL.createObjectURL(file);

                placeholder.classList.add(
                    "hidden"
                );


                /* VIDEO */

                if (file.type.startsWith("video/")) {

                    img.classList.add("hidden");

                    video.src = url;

                    video.classList.remove(
                        "hidden"
                    );

                }

                /* IMAGE / GIF */

                else {

                    video.classList.add(
                        "hidden"
                    );

                    img.src = url;

                    img.classList.remove(
                        "hidden"
                    );
                }
            });


        /* =====================================================
           REGISTER
           ===================================================== */

        document
            .getElementById("registerForm")
            .addEventListener("submit", async (e) => {

                e.preventDefault();

                const btn =
                    document.getElementById(
                        "btnRegister"
                    );

                const errorBox =
                    document.getElementById(
                        "errorMsg"
                    );

                const errorText =
                    document.getElementById(
                        "errorText"
                    );

                errorBox.classList.add(
                    "hidden"
                );

                btn.innerHTML =
                    '<i class="ri-loader-4-line spin"></i><span>Creando cuenta...</span>';

                btn.disabled = true;


                try {

                    const formData =
                        new FormData();


                    formData.append(
                        "nombre",
                        document
                            .getElementById("nombre")
                            .value
                            .trim()
                    );


                    formData.append(
                        "handle",
                        document
                            .getElementById("handle")
                            .value
                            .trim()
                            .toLowerCase()
                    );


                    formData.append(
                        "email",
                        document
                            .getElementById("email")
                            .value
                            .trim()
                    );


                    formData.append(
                        "password",
                        document
                            .getElementById("password")
                            .value
                    );


                    const avatarFile =
                        document
                            .getElementById(
                                "avatarInput"
                            )
                            .files[0];


                    if (avatarFile) {

                        formData.append(
                            "avatar",
                            avatarFile
                        );
                    }


                    const res =
                        await fetch(
                            "/api/auth/register",
                            {
                                method: "POST",
                                body: formData
                            }
                        );


                    const data =
                        await res.json();


                    if (!res.ok) {

                        throw new Error(
                            data.mensaje ||
                            "No se pudo crear la cuenta."
                        );
                    }


                    localStorage.setItem(
                        "fu_token",
                        data.token
                    );


                    localStorage.setItem(
                        "fu_usuario",
                        JSON.stringify(
                            data.usuario
                        )
                    );


                    window.location.href = "/";

                } catch (err) {

                    errorText.textContent =
                        err.message ||
                        "Ocurrió un error.";

                    errorBox.classList.remove(
                        "hidden"
                    );


                    btn.innerHTML =
                        '<i class="ri-user-add-line"></i><span>Crear cuenta</span>';

                    btn.disabled = false;
                }
            });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Crear cuenta — Foro Ubre</title>

  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
</head>

<body class="auth-page">

  <div class="auth-atmosphere" aria-hidden="true">
    <div class="auth-smoke auth-smoke-a"></div>
    <div class="auth-smoke auth-smoke-b"></div>
    <div class="auth-smoke auth-smoke-c"></div>
    <div class="auth-grain"></div>
    <div class="auth-orb"></div>
  </div>

  <main class="auth-stage">

    <div class="auth-container">

      <div class="auth-brand">

        <div class="auth-logo">
          <span class="auth-logo-mark">
            <i class="ri-leaf-fill"></i>
          </span>

          <span>Foro Ubre</span>
        </div>

        <span class="auth-live">
          <span></span>
          comunidad
        </span>

      </div>

      <div class="auth-heading">
        <h2>Crear tu cuenta</h2>
        <p>Únete a la conversación.</p>
      </div>

      <form id="registerForm">

        <div class="form-group">

          <label for="username">
            <i class="ri-user-3-line"></i>
            Nombre de usuario
          </label>

          <input
            type="text"
            id="username"
            name="username"
            placeholder="Tu nombre de usuario"
            autocomplete="username"
            maxlength="30"
            required
          >

        </div>

        <div class="form-group">

          <label for="email">
            <i class="ri-mail-line"></i>
            Correo electrónico
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="tu@email.com"
            autocomplete="email"
            required
          >

        </div>

        <div class="form-group">

          <label for="password">
            <i class="ri-lock-2-line"></i>
            Contraseña
          </label>

          <div class="input-password-wrap">

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Crea una contraseña"
              autocomplete="new-password"
              minlength="6"
              required
            >

            <button
              type="button"
              class="btn-toggle-pass"
              id="togglePassword"
              aria-label="Mostrar contraseña"
            >
              <i class="ri-eye-line"></i>
            </button>

          </div>

        </div>

        <div class="form-group">

          <label for="confirmPassword">
            <i class="ri-shield-check-line"></i>
            Confirmar contraseña
          </label>

          <div class="input-password-wrap">

            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Repite tu contraseña"
              autocomplete="new-password"
              minlength="6"
              required
            >

            <button
              type="button"
              class="btn-toggle-pass"
              id="toggleConfirmPassword"
              aria-label="Mostrar contraseña"
            >
              <i class="ri-eye-line"></i>
            </button>

          </div>

        </div>

        <div
          id="errorMsg"
          class="error-msg"
          style="display:none;"
        ></div>

        <button
          type="submit"
          class="btn-auth"
          id="registerBtn"
        >
          <span>Crear cuenta</span>
          <i class="ri-arrow-right-line"></i>
        </button>

      </form>

      <div class="auth-switch">
        ¿Ya tienes una cuenta?
        <a href="/login.html">Iniciar sesión</a>
      </div>

    </div>

  </main>

  <script>
    const form = document.getElementById("registerForm");

    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirmPassword");

    const togglePassword = document.getElementById("togglePassword");
    const toggleConfirmPassword =
      document.getElementById("toggleConfirmPassword");

    const errorMsg = document.getElementById("errorMsg");
    const registerBtn = document.getElementById("registerBtn");

    function toggleInput(input, button) {
      const isPassword = input.type === "password";

      input.type = isPassword ? "text" : "password";

      button.innerHTML = isPassword
        ? '<i class="ri-eye-off-line"></i>'
        : '<i class="ri-eye-line"></i>';

      button.setAttribute(
        "aria-label",
        isPassword ? "Ocultar contraseña" : "Mostrar contraseña"
      );
    }

    togglePassword.addEventListener("click", () => {
      toggleInput(password, togglePassword);
    });

    toggleConfirmPassword.addEventListener("click", () => {
      toggleInput(confirmPassword, toggleConfirmPassword);
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      errorMsg.style.display = "none";

      const username =
        document.getElementById("username").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const passwordValue = password.value;
      const confirmPasswordValue = confirmPassword.value;

      if (passwordValue !== confirmPasswordValue) {
        errorMsg.textContent = "Las contraseñas no coinciden.";
        errorMsg.style.display = "block";
        return;
      }

      registerBtn.disabled = true;

      registerBtn.innerHTML = `
        <span>Creando cuenta...</span>
        <i class="ri-loader-4-line"></i>
      `;

      try {
        const response = await fetch("/api/auth/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            username,
            email,
            password: passwordValue
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.message ||
            data.error ||
            "No se pudo crear la cuenta."
          );
        }

        if (data.token) {
          localStorage.setItem("token", data.token);
        }

        window.location.href = "/";
      } catch (error) {
        errorMsg.textContent = error.message;
        errorMsg.style.display = "block";
      } finally {
        registerBtn.disabled = false;

        registerBtn.innerHTML = `
          <span>Crear cuenta</span>
          <i class="ri-arrow-right-line"></i>
        `;
      }
    });
  </script>

</body>
</html>
